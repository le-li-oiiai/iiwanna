<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>I Wanna Shoot · 选关</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;width:100%;background:#05050c;color:#c8d0e8;
    font-family:'Courier New',Consolas,monospace;font-size:13px;overflow:hidden;
    overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
    touch-action:manipulation;}

  /* ============ 选关菜单 ============ */
  #menu{
    position:fixed;inset:0;overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:radial-gradient(circle at 50% 0%,#151535,#05050c 60%);
    z-index:100;
  }
  #menu.hidden{display:none;}
  .menu-inner{max-width:820px;margin:0 auto;padding:34px 20px 40px;}

  .menu-head{text-align:center;margin-bottom:26px;}
  .menu-head h1{
    color:#5eead4;font-size:28px;letter-spacing:2px;
    text-shadow:0 0 24px rgba(94,234,212,.5);margin-bottom:6px;
  }
  .menu-head .sub{color:#6a7290;font-size:12px;letter-spacing:3px;}

  .section{
    background:#0f0f1c;border:1px solid #1f1f38;border-radius:10px;
    padding:16px 18px;margin-bottom:16px;
    box-shadow:0 6px 30px rgba(0,0,0,.4);
  }
  .sec-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #1f1f38;
  }
  .sec-title{color:#6a7290;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;}
  .btn-sm{
    background:#161628;border:1px solid #2a2a4a;color:#c8d0e8;
    padding:5px 10px;border-radius:5px;cursor:pointer;font-family:inherit;
    font-size:11px;transition:.13s;
  }
  .btn-sm:hover{background:#232340;border-color:#3d3d66;color:#fff;}
  .btn-sm:active{transform:scale(.96);}

  .levels-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:10px;min-height:60px;
  }
  .level-card{
    background:linear-gradient(145deg,#151528,#111122);
    border:1px solid #2a2a4a;border-radius:8px;padding:14px 12px;
    cursor:pointer;position:relative;transition:.18s;overflow:hidden;
    min-height:78px;display:flex;flex-direction:column;justify-content:center;
  }
  .level-card::before{
    content:'';position:absolute;inset:0;opacity:0;transition:.18s;
    background:radial-gradient(circle at 50% 50%,rgba(94,234,212,.12),transparent 70%);
  }
  .level-card:hover{border-color:#5eead4;transform:translateY(-2px);box-shadow:0 8px 24px rgba(94,234,212,.18);}
  .level-card:hover::before{opacity:1;}
  .level-card:active{transform:scale(.97);}
  .card-badge{
    position:absolute;top:8px;right:8px;font-size:9px;letter-spacing:1px;
    padding:2px 6px;border-radius:3px;background:#1a1a2e;color:#6a7290;
    border:1px solid #2a2a4a;
  }
  .level-card:hover .card-badge{background:#123a35;color:#7dfbe1;border-color:#1e6b5e;}
  .card-name{color:#e2e8f0;font-size:13px;font-weight:bold;word-break:break-all;padding-right:44px;line-height:1.4;}
  .card-actions{position:absolute;bottom:6px;right:6px;display:flex;gap:4px;}
  .card-del{
    background:rgba(233,69,96,.12);border:1px solid rgba(233,69,96,.35);
    color:#e94560;width:20px;height:20px;border-radius:4px;cursor:pointer;
    font-size:11px;line-height:1;padding:0;transition:.13s;
  }
  .card-del:hover{background:#e94560;color:#fff;border-color:#e94560;}

  .empty-tip{grid-column:1/-1;text-align:center;color:#4a5270;font-size:12px;padding:22px 10px;line-height:1.8;}
  .empty-tip span{font-size:11px;opacity:.75;}
  .status{margin-top:10px;font-size:11px;color:#4a5270;text-align:center;min-height:16px;line-height:1.4;word-break:break-all;}
  .status.error{color:#e94560;}
  .hint-text{color:#6a7290;font-size:11px;line-height:1.7;margin-bottom:10px;}

  textarea{
    width:100%;background:#0a0a14;border:1px solid #26263f;color:#c8d0e8;
    padding:9px 11px;border-radius:6px;font-family:inherit;font-size:11px;
    resize:vertical;min-height:80px;outline:none;line-height:1.5;
    touch-action:auto;-webkit-user-select:text;user-select:text;
  }
  textarea:focus{border-color:#3d3d66;background:#0f0f1e;}
  .row{display:flex;gap:8px;margin-top:8px;align-items:stretch;}
  .row input{
    flex:1;min-width:0;background:#0a0a14;border:1px solid #26263f;color:#c8d0e8;
    padding:8px 11px;border-radius:6px;font-family:inherit;font-size:12px;outline:none;
    touch-action:auto;-webkit-user-select:text;user-select:text;
  }
  .row input:focus{border-color:#3d3d66;background:#0f0f1e;}

  .btn{
    background:#16302e;color:#7dfbe1;border:1px solid #2a5f57;
    padding:8px 16px;border-radius:6px;cursor:pointer;font-family:inherit;
    font-size:12px;transition:.13s;letter-spacing:.4px;white-space:nowrap;
  }
  .btn:hover{background:#175c53;border-color:#2a9b88;color:#a7fff0;}
  .btn:active{transform:translateY(1px);}
  .btn.ghost{background:#1a1a2e;color:#a0a8c8;border-color:#2f2f4d;}
  .btn.ghost:hover{background:#252540;color:#fff;}

  .menu-foot{text-align:center;color:#3a3f58;font-size:10px;margin-top:20px;line-height:1.8;}
  .menu-foot kbd{background:#1a1a2e;color:#7dfbe1;border:1px solid #2a2a4a;padding:1px 5px;border-radius:3px;font-size:10px;}

  /* ============ 游戏全屏容器 ============ */
  #wrap{
    position:fixed;inset:0;
    background:#000;
    display:none;
    align-items:center;justify-content:center;
    overflow:hidden;
  }
  #wrap.visible{display:flex;}
  #game{
    display:block;
    cursor:crosshair;
    touch-action:none;
    /* 尺寸由 JS 动态计算，保持 16:9 居中 */
  }

  .portrait-tip{
    position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);
    background:rgba(94,234,212,.15);border:1px solid rgba(94,234,212,.45);
    color:#7dfbe1;padding:6px 16px;border-radius:20px;
    font-size:12px;display:none;z-index:20;pointer-events:none;
    white-space:nowrap;
  }
  @media (orientation: portrait){
    #wrap.visible .portrait-tip{ display:block; }
  }

  /* ============ 触屏按钮 ============ */
  #touch-controls{
    display:none;
    position:fixed;inset:0;
    pointer-events:none;
    z-index:30;
  }
  body.is-touch #touch-controls{ display:block; }

  #touch-move{
    position:absolute;
    left:calc(16px + env(safe-area-inset-left,0px));
    bottom:calc(16px + env(safe-area-inset-bottom,0px));
    display:flex;gap:14px;
    pointer-events:none;
  }
  .touch-btn{
    pointer-events:auto;
    width:72px;height:72px;
    border-radius:50%;
    background:rgba(94,234,212,.16);
    border:2px solid rgba(94,234,212,.55);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:30px;font-weight:bold;
    user-select:none;-webkit-user-select:none;
    touch-action:none;
    -webkit-tap-highlight-color:transparent;
    transition:background .1s,transform .1s,border-color .1s;
    line-height:1;
  }
  .touch-btn.active{
    background:rgba(94,234,212,.5);
    border-color:rgba(94,234,212,.95);
    transform:scale(.94);
  }
  #btn-jump{
    position:absolute;
    right:calc(16px + env(safe-area-inset-right,0px));
    bottom:calc(16px + env(safe-area-inset-bottom,0px));
    width:82px;height:82px;
    font-size:32px;
    background:rgba(167,139,250,.16);
    border-color:rgba(167,139,250,.55);
  }
  #btn-jump.active{
    background:rgba(167,139,250,.5);
    border-color:rgba(167,139,250,.95);
  }

  /* ============ 退出按钮 ============ */
  #exit-btn{
    position:fixed;
    top:calc(10px + env(safe-area-inset-top,0px));
    right:calc(12px + env(safe-area-inset-right,0px));
    z-index:60;
    background:rgba(20,20,40,.88);color:#c8d0e8;border:1px solid #26263f;
    padding:8px 14px;border-radius:6px;cursor:pointer;font-family:inherit;
    font-size:12px;transition:.13s;display:none;backdrop-filter:blur(4px);
  }
  #exit-btn.visible{display:block;}
  #exit-btn:hover{background:#252540;color:#fff;border-color:#3d3d66;}
  #exit-btn:active{transform:scale(.95);}

  /* ============ 胜利界面 ============ */
  #win-overlay{
    position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    background:rgba(5,5,15,.88);backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;transition:opacity .4s;
  }
  #win-overlay.visible{ opacity:1;pointer-events:auto; }
  .win-title{
    font-size:56px;color:#fde047;text-shadow:0 0 30px #fde047;
    margin-bottom:10px;animation: bounceWin 1.5s infinite alternate;
  }
  @keyframes bounceWin { from{transform:translateY(0);} to{transform:translateY(-12px);} }
  .win-sub{ font-size:18px;color:#e2e8f0;margin-bottom:40px; }
  .win-actions{ display:flex;gap:16px; }
  .win-actions .btn{ padding:10px 24px; font-size:14px; }

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#252540;border-radius:4px;}
  ::-webkit-scrollbar-thumb:hover{background:#343460;}

  /* ============ 小屏适配 ============ */
  @media (max-width: 600px){
    .menu-inner{ padding:18px 12px 28px; }
    .menu-head{ margin-bottom:18px; }
    .menu-head h1{ font-size:22px; letter-spacing:1px; }
    .menu-head .sub{ font-size:10px; letter-spacing:2px; }
    .section{ padding:12px 12px; border-radius:8px; margin-bottom:12px; }
    .sec-head{ margin-bottom:10px; padding-bottom:8px; }
    .sec-title{ font-size:10px; letter-spacing:2px; }
    .btn-sm{ padding:7px 11px; font-size:12px; }
    .levels-grid{ grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; }
    .level-card{ min-height:68px; padding:11px 10px; border-radius:7px; }
    .card-name{ font-size:12px; padding-right:36px; }
    .card-badge{ font-size:8px; padding:1px 5px; top:6px; right:6px; }
    .card-del{ width:24px; height:24px; font-size:12px; }
    .hint-text{ font-size:10px; line-height:1.6; }
    textarea{ font-size:16px; padding:10px 12px; min-height:70px; }
    .row{ flex-wrap:wrap; gap:6px; }
    .row input{ flex:1 1 100%; font-size:16px; padding:10px 12px; }
    .row .btn{ flex:1 1 calc(50% - 3px); padding:11px 10px; font-size:13px; }
    .menu-foot{ font-size:9px; margin-top:14px; }
    .win-title{ font-size:40px; }
    .win-sub{ font-size:15px; margin-bottom:28px; }
    .win-actions{ gap:10px; }
    .win-actions .btn{ padding:11px 18px; font-size:13px; }
    #exit-btn{ padding:8px 12px; font-size:12px; }
  }
  @media (max-width: 380px){
    .menu-head h1{ font-size:19px; }
    .levels-grid{ grid-template-columns:1fr 1fr; }
  }
</style>
</head>
<body>

<div id="menu">
  <div class="menu-inner">
    <header class="menu-head">
      <h1>🎮 I WANNA SHOOT</h1>
      <p class="sub">S E L E C T   L E V E L</p>
    </header>

    <div class="section">
      <div class="sec-head">
        <span class="sec-title">可用关卡</span>
        <button class="btn-sm" id="btn-refresh">🔄 刷新列表</button>
      </div>
      <div id="levels-grid" class="levels-grid"></div>
      <div id="levels-status" class="status"></div>
    </div>

    <div class="section">
      <div class="sec-head">
        <span class="sec-title">添加关卡</span>
      </div>
      <p class="hint-text">
        想分享关卡给朋友？把 <kbd>.json</kbd> 文件上传到本页面同目录，并在 <kbd>levels.json</kbd> 里登记。<br>
        或者直接粘贴文本保存在你的浏览器本地。
      </p>
      <textarea id="paste-box" placeholder="粘贴编辑器导出的关卡 JSON 文本..."></textarea>
      <div class="row">
        <input id="level-name" type="text" placeholder="关卡名称（可选）">
        <button class="btn" id="btn-save-local">💾 保存到本地</button>
        <button class="btn ghost" id="btn-download">⬇ 下载 JSON</button>
      </div>
    </div>

    <footer class="menu-foot">
      用编辑器设计关卡 → 保存 JSON → 上传到本页面同目录<br>
      也可以用 <kbd>?level=xxx.json</kbd> 直接分享单个关卡链接
    </footer>
  </div>
</div>

<div id="wrap">
  <canvas id="game"></canvas>
  <div class="portrait-tip">📱 建议横屏游玩</div>

  <div id="touch-controls">
    <div id="touch-move">
      <div class="touch-btn" id="btn-left">◀</div>
      <div class="touch-btn" id="btn-right">▶</div>
    </div>
    <div class="touch-btn" id="btn-jump">↑</div>
  </div>

  <div id="win-overlay">
    <h2 class="win-title">🏆 YOU WIN!</h2>
    <div class="win-sub">死亡次数: <span id="win-deaths">0</span></div>
    <div class="win-actions">
      <button id="btn-back-menu" class="btn ghost">返回选关</button>
      <button id="btn-next-level" class="btn">下一关 ▶</button>
    </div>
  </div>
</div>
<button id="exit-btn">✕ 退出</button>

<script>
(function(){
"use strict";

var $ = function(id){ return document.getElementById(id); };

var menuEl   = $('menu');
var wrapEl   = $('wrap');
var exitBtn  = $('exit-btn');
var gridEl   = $('levels-grid');
var statusEl = $('levels-status');
var pasteBox = $('paste-box');
var nameInput= $('level-name');

var winOverlay = $('win-overlay');
var winDeathsEl = $('win-deaths');
var btnNextLevel = $('btn-next-level');
var btnBackMenu = $('btn-back-menu');

var currentGame = null;
var allLevels = [];
var currentLevelIndex = -1;

var LS_INDEX = 'iwsl_index';
var LS_DATA_PREFIX = 'iwsl_data_';

/* ============================================================
 *  设备检测（触屏才显示触屏按钮）
 * ============================================================ */
var isTouchDevice = ('ontouchstart' in window) ||
                    (navigator.maxTouchPoints > 0) ||
                    (navigator.msMaxTouchPoints > 0);

if(isTouchDevice){
  document.body.classList.add('is-touch');
}

/* ============================================================
 *  本地存储
 * ============================================================ */
function getLocalIndex(){
  try{ return JSON.parse(localStorage.getItem(LS_INDEX) || '[]'); }catch(e){ return []; }
}
function saveLocalIndex(idx){ try{ localStorage.setItem(LS_INDEX, JSON.stringify(idx)); }catch(e){} }
function getLocalData(id){ try{ return localStorage.getItem(LS_DATA_PREFIX + id); }catch(e){ return null; } }

function addLocalLevel(name, data){
  var idx = getLocalIndex();
  var id = 'L' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  idx.push({ id:id, name:name, created: Date.now() });
  saveLocalIndex(idx);
  try{ localStorage.setItem(LS_DATA_PREFIX + id, data); }catch(e){ alert('本地存储已满'); }
  return id;
}
function removeLocalLevel(id){
  saveLocalIndex(getLocalIndex().filter(function(x){ return x.id !== id; }));
  try{ localStorage.removeItem(LS_DATA_PREFIX + id); }catch(e){}
}

/* ============================================================
 *  在线关卡列表
 * ============================================================ */
function fetchOnlineLevels(){
  return fetch('levels.json?_=' + Date.now())
    .then(function(r){
      if(!r.ok) throw new Error('找不到 levels.json 文件 (HTTP ' + r.status + ')');
      return r.json();
    })
    .then(function(arr){
      if(!Array.isArray(arr)) throw new Error('levels.json 格式错误：必须是一个数组 []');
      var list = [];
      arr.forEach(function(item){
        if(typeof item === 'string'){
          list.push({ type:'remote', name: item.replace(/\.json$/i,''), url: item });
        } else if(item && (item.file || item.url)){
          list.push({ type:'remote', name: item.name || item.file || item.url, url: item.url || item.file });
        }
      });
      return list;
    });
}

function refreshLevelList(){
  statusEl.textContent = '正在读取关卡列表...';
  statusEl.classList.remove('error');
  gridEl.innerHTML = '';

  var local = getLocalIndex().map(function(x){
    return { type:'local', id:x.id, name:x.name };
  });

  fetchOnlineLevels()
    .then(function(remoteList){
      allLevels = local.concat(remoteList);

      if(allLevels.length === 0){
        gridEl.innerHTML =
          '<div class="empty-tip">还没有可用的关卡<br>' +
          '<span>请检查 levels.json 是否有内容，或粘贴到下方保存</span></div>';
        statusEl.textContent = '';
        return;
      }

      statusEl.textContent =
        '共 ' + allLevels.length + ' 个关卡（本地 ' + local.length + ' · 在线 ' + remoteList.length + '）';

      allLevels.forEach(function(item, index){
        gridEl.appendChild(buildLevelCard(item, index));
      });
    })
    .catch(function(err){
      allLevels = local.slice();
      if(allLevels.length > 0){
        allLevels.forEach(function(item, index){ gridEl.appendChild(buildLevelCard(item, index)); });
        statusEl.textContent = '在线列表获取失败：' + err.message + '（仅显示本地关卡）';
      } else {
        gridEl.innerHTML =
          '<div class="empty-tip">未能加载在线关卡<br>' +
          '<span>请确保 index.html 同目录下存在 levels.json 且格式正确</span></div>';
        statusEl.textContent = '加载失败：' + err.message;
      }
      statusEl.classList.add('error');
    });
}

function buildLevelCard(item, index){
  var card = document.createElement('div');
  card.className = 'level-card';

  var badge = document.createElement('div');
  badge.className = 'card-badge';
  badge.textContent = item.type === 'local' ? '本地' : '在线';

  var name = document.createElement('div');
  name.className = 'card-name';
  name.textContent = item.name;

  card.appendChild(badge);
  card.appendChild(name);

  if(item.type === 'local'){
    var actions = document.createElement('div');
    actions.className = 'card-actions';
    var delBtn = document.createElement('button');
    delBtn.className = 'card-del';
    delBtn.title = '删除本地关卡';
    delBtn.textContent = '✕';
    delBtn.addEventListener('click', function(e){
      e.stopPropagation();
      if(confirm('删除本地关卡「' + item.name + '」？')){
        removeLocalLevel(item.id);
        refreshLevelList();
      }
    });
    actions.appendChild(delBtn);
    card.appendChild(actions);
  }

  card.addEventListener('click', function(){ enterLevel(item, index); });
  return card;
}

/* ============================================================
 *  全屏 / 退出
 * ============================================================ */
function tryFullscreen(){
  try{
    var el = document.documentElement;
    if(el.requestFullscreen){
      var p = el.requestFullscreen();
      if(p && p.catch) p.catch(function(){});
    } else if(el.webkitRequestFullscreen){
      el.webkitRequestFullscreen();
    } else if(el.msRequestFullscreen){
      el.msRequestFullscreen();
    }
  }catch(e){}
}

function tryExitFullscreen(){
  try{
    if(document.fullscreenElement){
      if(document.exitFullscreen) document.exitFullscreen().catch(function(){});
      else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  }catch(e){}
}

/* 浏览器返回键 / 手势返回：如果在关卡内则回到选关 */
window.addEventListener('popstate', function(){
  if(wrapEl.classList.contains('visible')){
    exitLevel(true);
  }
});

/* ============================================================
 *  进入关卡
 * ============================================================ */
function enterLevel(item, index){
  // 在点击手势上下文中尝试全屏（移动端）
  tryFullscreen();

  currentLevelIndex = (index !== undefined) ? index : allLevels.indexOf(item);

  if(item.type === 'local'){
    var txt = getLocalData(item.id);
    if(!txt){ alert('本地关卡数据丢失'); refreshLevelList(); return; }
    loadAndStart(txt, item.name);
    return;
  }

  statusEl.textContent = '正在加载「' + item.name + '」...';
  statusEl.classList.remove('error');

  fetch(item.url + '?_=' + Date.now())
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function(txt){ loadAndStart(txt, item.name); })
    .catch(function(e){
      statusEl.textContent = '关卡加载失败：' + e.message;
      statusEl.classList.add('error');
    });
}

function loadAndStart(raw, displayName){
  var data;
  try{ data = JSON.parse(raw); }
  catch(e){ alert('关卡 JSON 解析失败：' + e.message); return; }

  var level;
  try{ level = normalizeLevel(data); }
  catch(e){ alert('关卡数据格式不正确：' + e.message); return; }

  if(currentGame){ try{ currentGame.stop(); }catch(e){} currentGame = null; }

  winOverlay.classList.remove('visible');

  var oldCvs = document.getElementById('game');
  var newCvs = document.createElement('canvas');
  newCvs.id = 'game';
  oldCvs.parentNode.replaceChild(newCvs, oldCvs);

  menuEl.classList.add('hidden');
  wrapEl.classList.add('visible');
  exitBtn.classList.add('visible');

  // 让 canvas 适配全屏（保持 16:9 居中）
  resizeGameCanvas();

  // 压入历史记录，让浏览器返回键可以回到选关
  try{ history.pushState({ inGame: true }, '', location.href); }catch(e){}

  try{
    currentGame = startGameEngine(newCvs, level, function(deaths){
      showWinScreen(deaths);
    });
  }catch(e){
    wrapEl.classList.remove('visible');
    exitBtn.classList.remove('visible');
    menuEl.classList.remove('hidden');
    tryExitFullscreen();
    alert('游戏启动失败：' + e.message);
  }
}

/* ============================================================
 *  Canvas 尺寸计算（保持 16:9 居中，全屏黑边填充）
 * ============================================================ */
function resizeGameCanvas(){
  var cvs = document.getElementById('game');
  if(!cvs || !wrapEl.classList.contains('visible')) return;

  var vw = window.innerWidth;
  var vh = window.innerHeight;
  var ratio = 960 / 540;

  var cw, ch;
  if(vw / vh > ratio){
    ch = vh;
    cw = vh * ratio;
  } else {
    cw = vw;
    ch = vw / ratio;
  }
  cvs.style.width = cw + 'px';
  cvs.style.height = ch + 'px';
}

window.addEventListener('resize', resizeGameCanvas);
window.addEventListener('orientationchange', function(){
  setTimeout(resizeGameCanvas, 120);
});

/* ============================================================
 *  胜利 / 退出
 * ============================================================ */
function showWinScreen(deaths){
  winDeathsEl.textContent = deaths;
  winOverlay.classList.add('visible');

  if(currentLevelIndex >= 0 && currentLevelIndex < allLevels.length - 1){
    btnNextLevel.disabled = false;
    btnNextLevel.textContent = '下一关 ▶';
    btnNextLevel.style.opacity = '1';
    btnNextLevel.style.cursor = 'pointer';
  } else {
    btnNextLevel.disabled = true;
    btnNextLevel.textContent = '已是最后一关';
    btnNextLevel.style.opacity = '0.5';
    btnNextLevel.style.cursor = 'default';
  }
}

function exitLevel(skipConfirm){
  var isWin = winOverlay.classList.contains('visible');
  if(!skipConfirm && !isWin){
    if(!confirm('退出并回到选关界面？')) return;
  }

  if(currentGame){ try{ currentGame.stop(); }catch(e){} currentGame = null; }

  winOverlay.classList.remove('visible');
  wrapEl.classList.remove('visible');
  exitBtn.classList.remove('visible');
  menuEl.classList.remove('hidden');

  tryExitFullscreen();

  var cvs = document.getElementById('game');
  if(cvs){ var ctx = cvs.getContext('2d'); ctx.clearRect(0,0,cvs.width,cvs.height); }
}

exitBtn.addEventListener('click', function(){ exitLevel(false); });
btnBackMenu.addEventListener('click', function(){ exitLevel(true); });

btnNextLevel.addEventListener('click', function(){
  if(currentLevelIndex >= 0 && currentLevelIndex < allLevels.length - 1){
    enterLevel(allLevels[currentLevelIndex + 1], currentLevelIndex + 1);
  }
});

/* ============================================================
 *  关卡数据规范化
 * ============================================================ */
function num(v, def){
  var n = Number(v);
  return isFinite(n) ? n : def;
}
function clampNum(v, min, max, def){
  var n = Number(v);
  if(!isFinite(n)) n = def;
  return Math.max(min, Math.min(max, n));
}
function posNum(v, def){
  var n = Number(v);
  if(!isFinite(n) || n <= 0) return def;
  return n;
}

function normalizeHitboxes(arr){
  if(!Array.isArray(arr)) return [];
  var out = [];
  for(var i = 0; i < arr.length; i++){
    var h = arr[i] || {};
    out.push({
      x: num(h.x, 0),
      y: num(h.y, 0),
      w: num(h.w, 20),
      h: num(h.h, 20),
      isRelative: !!h.isRelative,
      triggerCount: Math.max(0, Math.floor(num(h.triggerCount, 0))),
      resetOnDeath: h.resetOnDeath !== false,
      triggerMove: !!h.triggerMove,
      triggerMorph: !!h.triggerMorph,
      triggerVisibility: !!h.triggerVisibility,
      triggerSlow: !!h.triggerSlow,
      triggerFast: !!h.triggerFast,
      triggerBounce: !!h.triggerBounce,
      triggerDamage: !!h.triggerDamage
    });
  }
  return out;
}

function normalizePath(p){
  if(!Array.isArray(p)) return [];
  var out = [];
  for(var i = 0; i < p.length; i++){
    var n = p[i] || {};
    out.push({ x: num(n.x, 0), y: num(n.y, 0) });
  }
  return out;
}

function normalizeLevel(d){
  if(!d || typeof d !== 'object') throw new Error('关卡数据格式错误');

  var L = {
    worldW:      clampNum(d.worldW, 400, 20000, 4000),
    worldH:      clampNum(d.worldH, 200, 3000, 540),
    playerMaxHp: clampNum(d.playerMaxHp, 1, 99, 3),
    spawn: {
      x: num(d.spawn && d.spawn.x, 60),
      y: num(d.spawn && d.spawn.y, 458)
    },
    solids: [], movers: [], spikes: [], adv_spikes: [],
    enemies: [], checkpoints: [], goal: null
  };

  (d.solids || []).forEach(function(s){
    s = s || {};
    var w = posNum(s.w, 1), h = posNum(s.h, 1);
    L.solids.push({
      x: num(s.x, 0), y: num(s.y, 0), w: w, h: h,
      morph: s.morph || 'none',
      morphLoop: s.morphLoop !== false,
      targetW: s.targetW !== undefined ? posNum(s.targetW, w) : w,
      targetH: s.targetH !== undefined ? posNum(s.targetH, h) : h,
      targetOffX: num(s.targetOffX, 0),
      targetOffY: num(s.targetOffY, 0),
      hitboxes: normalizeHitboxes(s.hitboxes)
    });
  });

  (d.movers || []).forEach(function(m){
    m = m || {};
    var w = posNum(m.w, 1), h = posNum(m.h, 1);
    L.movers.push({
      x: num(m.x, 0), y: num(m.y, 0), w: w, h: h,
      ax: num(m.ax, 0),
      ay: num(m.ay, 0),
      spd: m.spd !== undefined ? num(m.spd, 0.02) : 0.02,
      phase: num(m.phase, 0),
      path: normalizePath(m.path),
      pathSpeed: m.pathSpeed !== undefined ? num(m.pathSpeed, 2) : 2,
      pathDist: num(m.pathDist, 0),
      pathDir: m.pathDir === -1 ? -1 : 1,
      morph: m.morph || 'none',
      morphLoop: m.morphLoop !== false,
      targetW: m.targetW !== undefined ? posNum(m.targetW, w) : w,
      targetH: m.targetH !== undefined ? posNum(m.targetH, h) : h,
      targetOffX: num(m.targetOffX, 0),
      targetOffY: num(m.targetOffY, 0),
      hitboxes: normalizeHitboxes(m.hitboxes)
    });
  });

  (d.spikes || []).forEach(function(s){
    s = s || {};
    L.spikes.push({
      x: num(s.x, 0), y: num(s.y, 0),
      w: posNum(s.w, 1), h: posNum(s.h, 1)
    });
  });

  (d.adv_spikes || []).forEach(function(s){
    s = s || {};
    var w = posNum(s.w, 1), h = posNum(s.h, 1);
    var dmg = num(s.damage, 1);
    if(dmg <= 0) dmg = 1;
    L.adv_spikes.push({
      x: num(s.x, 0), y: num(s.y, 0), w: w, h: h,
      damage: dmg,
      shape: s.shape || 'triangle',
      visibility: s.visibility || 'always',
      morph: s.morph || 'none',
      morphLoop: s.morphLoop !== false,
      layer: s.layer || 'top',
      targetW: s.targetW !== undefined ? posNum(s.targetW, w) : w,
      targetH: s.targetH !== undefined ? posNum(s.targetH, h) : h,
      targetOffX: num(s.targetOffX, 0),
      targetOffY: num(s.targetOffY, 0),
      hitboxes: normalizeHitboxes(s.hitboxes),
      phase: num(s.phase, 0),
      path: normalizePath(s.path),
      pathSpeed: s.pathSpeed !== undefined ? num(s.pathSpeed, 2) : 2,
      pathDist: num(s.pathDist, 0),
      pathDir: s.pathDir === -1 ? -1 : 1
    });
  });

  (d.enemies || []).forEach(function(e){
    e = e || {};
    var type = e.type === 'shooter' ? 'shooter' : 'walker';
    var w = posNum(e.w, 1), h = posNum(e.h, 1);
    var hp = Math.max(1, Math.floor(num(e.hp, 1)));
    var maxHp = Math.max(1, Math.floor(num(e.maxHp !== undefined ? e.maxHp : hp, hp)));
    var dmg = Math.max(1, Math.floor(num(e.damage, 1)));

    var base = {
      type: type,
      x: num(e.x, 0), y: num(e.y, 0), w: w, h: h,
      alive: true,
      path: normalizePath(e.path),
      pathSpeed: e.pathSpeed !== undefined ? num(e.pathSpeed, 2) : 2,
      pathDist: num(e.pathDist, 0),
      pathDir: e.pathDir === -1 ? -1 : 1,
      hitboxes: normalizeHitboxes(e.hitboxes),
      hp: hp,
      maxHp: maxHp,
      damage: dmg,
      resetOnDeath: e.resetOnDeath !== false
    };

    if(type === 'walker'){
      base.minX = e.minX !== undefined ? num(e.minX, num(e.x, 0) - 100) : num(e.x, 0) - 100;
      base.maxX = e.maxX !== undefined ? num(e.maxX, num(e.x, 0) + w + 100) : num(e.x, 0) + w + 100;
      base.vx   = e.vx !== undefined ? num(e.vx, 1.5) : 1.5;
    } else {
      base.baseY = e.baseY !== undefined ? num(e.baseY, num(e.y, 0)) : num(e.y, 0);
      base.phase = num(e.phase, 0);
      base.cd    = e.cd !== undefined ? num(e.cd, 90) : 90;
    }
    L.enemies.push(base);
  });

  (d.checkpoints || []).forEach(function(c){
    c = c || {};
    var cx = num(c.x, 0), cy = num(c.y, 0);
    var cw = posNum(c.w, 20), ch = posNum(c.h, 40);
    L.checkpoints.push({
      type: c.type === 'trigger' ? 'trigger' : 'checkpoint',
      x: cx, y: cy, w: cw, h: ch,
      spawnX: c.spawnX !== undefined ? num(c.spawnX, cx + cw/2 - 7) : Math.round(cx + cw/2 - 7),
      spawnY: c.spawnY !== undefined ? num(c.spawnY, cy + ch - 22)   : Math.round(cy + ch - 22),
      active: false
    });
  });

  if(d.goal && (posNum(d.goal.w, 0) > 0 || posNum(d.goal.h, 0) > 0)){
    L.goal = {
      x: num(d.goal.x, 0),
      y: num(d.goal.y, 0),
      w: posNum(d.goal.w, 34),
      h: posNum(d.goal.h, 80)
    };
  } else {
    L.goal = { x: Math.max(0, L.worldW - 120), y: 400, w: 34, h: 80 };
  }

  return L;
}

/* ============================================================
 *  游戏引擎
 * ============================================================ */
function startGameEngine(cvs, L, onWinCallback){

  var ctx = cvs.getContext('2d');
  var W = 960, H = 540;
  cvs.width = W; cvs.height = H;
  ctx.imageSmoothingEnabled = false;

  var running = true;
  var winTriggered = false;
  var rafId = null;
  var listeners = [];

  function on(target, event, fn, opts){
    target.addEventListener(event, fn, opts);
    listeners.push({ target: target, event: event, fn: fn, opts: opts });
  }

  var clamp = function(v,a,b){ return v<a?a:v>b?b:v; };
  var rnd = function(a,b){ return a + Math.random()*(b-a); };
  var rectHit = function(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  };

  /* ---------- 关卡数据 ---------- */
  var WORLD_W = L.worldW;
  var WORLD_H = L.worldH;
  var MAX_HP  = L.playerMaxHp;
  var SPAWN   = L.spawn;
  var staticSolids = L.solids;
  var movers       = L.movers;
  var spikes       = L.spikes;
  var adv_spikes   = L.adv_spikes;
  var enemies      = L.enemies;
  var checkpoints  = L.checkpoints;
  var goal         = L.goal;

  var solids = staticSolids.concat(movers);

  solids.forEach(function(e){
    e.ow = e.w; e.oh = e.h; e.ox = e.x; e.oy = e.y;
    if(e.hitboxes) e.hitboxes.forEach(function(h){ h._hits = 0; h._curCollide = false; });
  });
  adv_spikes.forEach(function(e){
    e.ow = e.w; e.oh = e.h; e.ox = e.x; e.oy = e.y;
    if(e.hitboxes) e.hitboxes.forEach(function(h){ h._hits = 0; h._curCollide = false; });
  });
  enemies.forEach(function(e){
    if(e.hitboxes) e.hitboxes.forEach(function(h){ h._hits = 0; h._curCollide = false; });
    if(e.hp === undefined) e.hp = 1;
    if(e.maxHp === undefined) e.maxHp = e.hp;
    if(e.damage === undefined) e.damage = 1;
  });

  /* ---------- 碰撞箱计算 ---------- */
  function getHitboxRect(ent, h, t) {
    if (!h.isRelative) {
      return { x: h.x, y: h.y, w: h.w, h: h.h };
    }
    var morph = ent.morph || 'none';
    if (ent.morphDemo === false) morph = 'none';

    var ow = ent.ow !== undefined ? ent.ow : ent.w;
    var oh = ent.oh !== undefined ? ent.oh : ent.h;
    var ox = ent.ox !== undefined ? ent.ox : ent.x;
    var oy = ent.oy !== undefined ? ent.oy : ent.y;

    var cw = ow, ch = oh;
    if (morph === 'pulse') {
      var scale = 1 + Math.sin(t * 0.1) * 0.2;
      cw = ow * scale; ch = oh * scale;
    } else if (morph === 'stretch') {
      var p = (Math.sin(t * 0.05) + 1) / 2;
      cw = ow + ((ent.targetW || ow) - ow) * p;
      ch = oh + ((ent.targetH || oh) - oh) * p;
    }

    var sx = cw / ow, sy = ch / oh;
    var ecx = ent.x + ent.w / 2, ecy = ent.y + ent.h / 2;
    var ocx = ox + ow / 2, ocy = oy + oh / 2;
    var ohcx = ox + h.x + h.w / 2, ohcy = oy + h.y + h.h / 2;
    var offsetX = ohcx - ocx, offsetY = ohcy - ocy;
    var new_hcx = ecx + offsetX * sx, new_hcy = ecy + offsetY * sy;
    var new_hw = h.w * sx, new_hh = h.h * sy;

    return { x: new_hcx - new_hw / 2, y: new_hcy - new_hh / 2, w: new_hw, h: new_hh };
  }

  /* ---------- 音效 ---------- */
  var audioCtx = null;
  function initAudio(){
    if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  }
  function beep(freq, dur, type, vol){
    if(!audioCtx) return;
    try{
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, audioCtx.currentTime);
      g.gain.setValueAtTime(vol || 0.02, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    }catch(e){}
  }

  /* ---------- 状态（先声明 player，按钮事件里会用到） ---------- */
  var state = {
    mode: 'play', deaths: 0, camX: 0, shake: 0, deadTimer: 0, winTimer: 0, t: 0,
    spawn: { x: SPAWN.x, y: SPAWN.y }
  };
  var player = {
    x: SPAWN.x, y: SPAWN.y, w: 14, h: 22, vx: 0, vy: 0,
    onGround: false, ground: null, jumpsLeft: 1, coyote: 0, jumpBuffer: 0,
    facing: 1, shootCd: 0, aimAngle: 0,
    maxHp: MAX_HP, hp: MAX_HP, invTimer: 0,
    slowTimer: 0, fastTimer: 0, bounceCd: 0
  };
  var bullets = [], enemyBullets = [], particles = [];

  /* ============================================================
   *  触摸输入
   * ============================================================ */
  var touchState = { left: false, right: false, jump: false };

  // 触摸射击：记录第一个落在 canvas 上的触摸
  var aimTouchId = null;
  var aimLogicX = W * 0.8;
  var aimLogicY = H / 2;
  var touchAimActive = false;

  function getCanvasPos(t){
    var r = cvs.getBoundingClientRect();
    return {
      x: (t.clientX - r.left) * (W / r.width),
      y: (t.clientY - r.top)  * (H / r.height)
    };
  }

  function onCanvasTouchStart(e){
    e.preventDefault();
    initAudio();
    for(var i = 0; i < e.changedTouches.length; i++){
      var t = e.changedTouches[i];
      if(aimTouchId === null){
        aimTouchId = t.identifier;
        var p = getCanvasPos(t);
        aimLogicX = p.x;
        aimLogicY = p.y;
        touchAimActive = true;
      }
    }
  }
  function onCanvasTouchMove(e){
    e.preventDefault();
    for(var i = 0; i < e.changedTouches.length; i++){
      var t = e.changedTouches[i];
      if(t.identifier === aimTouchId){
        var p = getCanvasPos(t);
        aimLogicX = p.x;
        aimLogicY = p.y;
      }
    }
  }
  function onCanvasTouchEnd(e){
    e.preventDefault();
    for(var i = 0; i < e.changedTouches.length; i++){
      var t = e.changedTouches[i];
      if(t.identifier === aimTouchId){
        aimTouchId = null;
        touchAimActive = false;
      }
    }
  }

  on(cvs, 'touchstart', onCanvasTouchStart, { passive: false });
  on(cvs, 'touchmove',  onCanvasTouchMove,  { passive: false });
  on(cvs, 'touchend',   onCanvasTouchEnd,   { passive: false });
  on(cvs, 'touchcancel',onCanvasTouchEnd,   { passive: false });

  /* ---------- 触屏按钮（HTML 元素，固定在屏幕边缘） ---------- */
  function bindHoldButton(btn, onDown, onUp){
    if(!btn) return;
    function down(e){
      e.preventDefault();
      e.stopPropagation();
      initAudio();
      btn.classList.add('active');
      onDown();
    }
    function up(e){
      e.preventDefault();
      e.stopPropagation();
      btn.classList.remove('active');
      onUp();
    }
    on(btn, 'touchstart', down, { passive: false });
    on(btn, 'touchend',   up,   { passive: false });
    on(btn, 'touchcancel',up,   { passive: false });
  }

  bindHoldButton($('btn-left'),
    function(){ touchState.left = true; },
    function(){ touchState.left = false; });

  bindHoldButton($('btn-right'),
    function(){ touchState.right = true; },
    function(){ touchState.right = false; });

  bindHoldButton($('btn-jump'),
    function(){ touchState.jump = true; player.jumpBuffer = 8; },
    function(){ touchState.jump = false; });

  /* ---------- 键盘 ---------- */
  var keys = {};
  var mouse = { x: W*0.8, y: H/2, down: false };
  var lastTouchTime = 0;

  on(window, 'keydown', function(e){
    if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code) >= 0) e.preventDefault();
    if(!keys[e.code]){
      if(e.code==='Space' || e.code==='KeyW' || e.code==='ArrowUp') player.jumpBuffer = 8;
      if(e.code === 'KeyR' && state.mode === 'play') killPlayer();
    }
    keys[e.code] = true;
    initAudio();
  });
  on(window, 'keyup', function(e){ keys[e.code] = false; });
  on(window, 'blur', function(){
    for(var k in keys) keys[k] = false;
    mouse.down = false;
    touchState.left = touchState.right = touchState.jump = false;
    touchAimActive = false;
    aimTouchId = null;
  });

  /* ---------- 鼠标（过滤触摸后 500ms 内的模拟鼠标事件） ---------- */
  on(cvs, 'mousemove', function(e){
    if(Date.now() - lastTouchTime < 500) return;
    var r = cvs.getBoundingClientRect();
    mouse.x = (e.clientX - r.left) * (W / r.width);
    mouse.y = (e.clientY - r.top)  * (H / r.height);
  });
  on(cvs, 'mousedown', function(e){
    if(Date.now() - lastTouchTime < 500) return;
    mouse.down = true;
    initAudio();
    e.preventDefault();
  });
  on(window, 'mouseup', function(){ mouse.down = false; });
  on(cvs, 'contextmenu', function(e){ e.preventDefault(); });

  // 触摸时更新 lastTouchTime（阻止触摸后的模拟鼠标事件）
  on(window, 'touchstart', function(){ lastTouchTime = Date.now(); }, { passive: true });

  /* ---------- 轨迹运动 ---------- */
  function updatePath(e){
    if(!e.path || e.path.length < 2) return;
    var totalLen = 0, lens = [];
    for(var i=0; i<e.path.length-1; i++){
      var dx = e.path[i+1].x - e.path[i].x;
      var dy = e.path[i+1].y - e.path[i].y;
      var l = Math.hypot(dx, dy);
      lens.push(l); totalLen += l;
    }
    if(totalLen === 0) return;
    if(e.pathDist === undefined) e.pathDist = 0;
    if(e.pathDir === undefined) e.pathDir = 1;

    e.pathDist += (e.pathSpeed || 2) * e.pathDir;
    if(e.pathDist > totalLen){ e.pathDist = totalLen; e.pathDir = -1; }
    if(e.pathDist < 0){ e.pathDist = 0; e.pathDir = 1; }

    var d = e.pathDist;
    for(var i=0; i<lens.length; i++){
      if(d <= lens[i] || i === lens.length - 1){
        var t = d / lens[i]; if(t > 1) t = 1;
        var pcx = e.path[i].x + (e.path[i+1].x - e.path[i].x) * t;
        var pcy = e.path[i].y + (e.path[i+1].y - e.path[i].y) * t;
        e.x = pcx - e.w / 2;
        e.y = pcy - e.h / 2;
        break;
      }
      d -= lens[i];
    }
  }

  /* ---------- 形变 ---------- */
  function updateMorphs(){
    var all = solids.concat(adv_spikes);
    for(var i=0; i<all.length; i++){
      var e = all[i];
      var active = true;

      if (e.hitboxes && e.hitboxes.length) {
        var hasMorphTrigger = false;
        for (var j=0; j<e.hitboxes.length; j++) {
          if (e.hitboxes[j].triggerMorph) { hasMorphTrigger = true; break; }
        }
        if (hasMorphTrigger) active = !!e._morphActivated;
      }

      var newW = e.ow, newH = e.oh;
      var offX = 0, offY = 0;

      if (active && e.morph === 'pulse') {
        var scale = 1 + Math.sin(state.t * 0.1) * 0.2;
        newW = e.ow * scale; newH = e.oh * scale;
      } else if (active && e.morph === 'stretch') {
        var p;
        if (e.morphLoop === false) {
          if (e._morphStartT === undefined) e._morphStartT = state.t;
          p = clamp((state.t - e._morphStartT) / 60, 0, 1);
        } else {
          p = (Math.sin(state.t * 0.05) + 1) / 2;
        }
        newW = e.ow + ((e.targetW || e.ow) - e.ow) * p;
        newH = e.oh + ((e.targetH || e.oh) - e.oh) * p;
        offX = (e.targetOffX || 0) * p;
        offY = (e.targetOffY || 0) * p;
      }

      var prevOffX = e._morphOffX || 0, prevOffY = e._morphOffY || 0;
      if (newW !== e.w || newH !== e.h || offX !== prevOffX || offY !== prevOffY) {
        var cx = e.x + e.w / 2, cy = e.y + e.h / 2;
        var ddx = offX - prevOffX, ddy = offY - prevOffY;
        e.w = newW; e.h = newH;
        e.x = cx + ddx - e.w / 2;
        e.y = cy + ddy - e.h / 2;
        e._morphOffX = offX; e._morphOffY = offY;
      }
    }
  }

  /* ---------- 粒子 ---------- */
  function addParticles(x, y, n, color, spd, life){
    life = life || 30;
    for(var i=0;i<n;i++){
      var a = Math.random()*Math.PI*2, s = rnd(spd*0.3, spd);
      particles.push({
        x: x, y: y,
        vx: Math.cos(a)*s, vy: Math.sin(a)*s - 1,
        life: rnd(life*0.5, life), maxLife: life,
        color: color, size: rnd(1.5, 3.5)
      });
    }
  }
  function updateParticles(){
    for(var i=particles.length-1;i>=0;i--){
      var p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.vx *= 0.97; p.life--;
      if(p.life <= 0) particles.splice(i,1);
    }
  }

  /* ---------- 物理移动 ---------- */
  function moveEntity(e, list){
    e.x += e.vx;
    for(var i=0;i<list.length;i++){
      var s = list[i];
      if(s._hidden) continue;
      if(rectHit(e, s)){
        if(e.vx > 0) e.x = s.x - e.w;
        else if(e.vx < 0) e.x = s.x + s.w;
        e.vx = 0;
      }
    }
    e.y += e.vy;
    e.onGround = false; e.ground = null;
    for(var j=0;j<list.length;j++){
      var t = list[j];
      if(t._hidden) continue;
      if(rectHit(e, t)){
        if(e.vy >= 0){ e.y = t.y - e.h; e.vy = 0; e.onGround = true; e.ground = t; }
        else { e.y = t.y + t.h; e.vy = 0; }
      }
    }
  }

  /* ---------- 移动平台 ---------- */
  function updateMovers(){
    for(var i=0;i<movers.length;i++){
      var m = movers[i], px = m.x, py = m.y;

      var triggerMove = false, hasMoveTrigger = false;
      if (m.hitboxes) {
        for(var j=0; j<m.hitboxes.length; j++){
          var h = m.hitboxes[j];
          if (h.triggerMove) {
            hasMoveTrigger = true;
            var hmTc = h.triggerCount || 0;
            if (hmTc === 0) {
              if (rectHit(player, getHitboxRect(m, h, state.t))) triggerMove = true;
            } else if (h._hits >= hmTc) {
              triggerMove = true;
            }
          }
        }
      }

      m._activeMove = hasMoveTrigger ? triggerMove : true;

      if (m._activeMove) {
        if (m.path && m.path.length >= 2) {
          updatePath(m);
        } else {
          m.phase += m.spd;
          m.x = m.ox + Math.sin(m.phase) * m.ax;
          m.y = m.oy + Math.sin(m.phase) * m.ay;
        }
      }

      m.dx = m.x - px; m.dy = m.y - py;
      if(player.onGround && player.ground === m && state.mode === 'play'){
        player.x += m.dx; player.y += m.dy;
      }
    }
  }

  /* ---------- 玩家 ---------- */
  function updatePlayer(){
    var p = player;

    if (p.slowTimer > 0) p.slowTimer--;
    if (p.fastTimer > 0) p.fastTimer--;
    if (p.bounceCd > 0) p.bounceCd--;

    var spdMod = 1;
    if (p.slowTimer > 0) spdMod = 0.5;
    else if (p.fastTimer > 0) spdMod = 1.8;

    var ax = 0;
    if(keys['ArrowLeft'] || keys['KeyA'] || touchState.left) ax--;
    if(keys['ArrowRight']|| keys['KeyD'] || touchState.right) ax++;
    if(ax !== 0){ p.vx += ax * 1.25 * spdMod; p.facing = ax; }
    else { p.vx *= 0.78; if(Math.abs(p.vx) < 0.15) p.vx = 0; }
    p.vx = clamp(p.vx, -4.6 * spdMod, 4.6 * spdMod);

    p.vy += 0.62;
    if(p.vy > 15) p.vy = 15;

    moveEntity(p, solids);

    if(p.onGround){ p.jumpsLeft = 1; p.coyote = 8; }
    else if(p.coyote > 0) p.coyote--;

    if(p.jumpBuffer > 0) p.jumpBuffer--;
    if(p.jumpBuffer > 0){
      if(p.onGround || p.coyote > 0){
        p.vy = -11.6; p.jumpsLeft = 1; p.coyote = 0; p.onGround = false; p.jumpBuffer = 0;
        addParticles(p.x + p.w/2, p.y + p.h, 6, '#5eead4', 2.5, 18);
        beep(430, 0.07, 'square', 0.018);
      } else if(p.jumpsLeft > 0){
        p.vy = -10.2; p.jumpsLeft = 0; p.jumpBuffer = 0;
        addParticles(p.x + p.w/2, p.y + p.h, 12, '#a78bfa', 4, 22);
        beep(680, 0.08, 'square', 0.018);
      }
    }

    if(p.invTimer > 0) p.invTimer--;

    // 瞄准：触屏优先，否则鼠标
    var aimX = touchAimActive ? aimLogicX : mouse.x;
    var aimY = touchAimActive ? aimLogicY : mouse.y;
    var wmx = aimX + state.camX;
    p.aimAngle = Math.atan2(aimY - (p.y + p.h/2), wmx - (p.x + p.w/2));

    if(p.shootCd > 0) p.shootCd--;
    var wantShoot = mouse.down || keys['KeyJ'] || touchAimActive;
    if(wantShoot && p.shootCd <= 0){
      shoot();
      p.shootCd = 9;
    }

    checkHitboxTriggers();
    checkHazards();
  }

  function shoot(){
    var p = player, a = p.aimAngle;
    var cx = p.x + p.w/2 + Math.cos(a)*14;
    var cy = p.y + p.h/2 + Math.sin(a)*14;
    bullets.push({ x: cx, y: cy, vx: Math.cos(a)*14, vy: Math.sin(a)*14, life: 80 });
    p.vx -= Math.cos(a) * 0.6;
    addParticles(cx, cy, 4, '#fde047', 3, 12);
    state.shake = Math.max(state.shake, 2.2);
    beep(900 + rnd(-60,60), 0.045, 'square', 0.012);
  }

  /* ---------- 子弹 ---------- */
  function updateBullets(){
    for(var i=bullets.length-1;i>=0;i--){
      var b = bullets[i];
      b.x += b.vx; b.y += b.vy; b.life--;
      var hit = b.life <= 0;

      if(!hit){
        for(var k=0;k<solids.length;k++){
          var s = solids[k];
          if(s._hidden) continue;
          if(b.x > s.x && b.x < s.x+s.w && b.y > s.y && b.y < s.y+s.h){ hit = true; break; }
        }
      }
      if(!hit){
        for(var m=0;m<enemies.length;m++){
          var e = enemies[m];
          if(!e.alive || e._hidden) continue;
          if(b.x > e.x && b.x < e.x+e.w && b.y > e.y && b.y < e.y+e.h){
            e.hp = (e.hp === undefined ? 1 : e.hp) - 1;
            hit = true;
            if (e.hp <= 0) {
              e.alive = false;
              addParticles(b.x, b.y, 16, '#f59e0b', 5.5, 30);
              addParticles(b.x, b.y, 8, '#fde047', 3.5, 20);
              state.shake = 8; beep(260, 0.13, 'sawtooth', 0.03);
            } else {
              addParticles(b.x, b.y, 8, '#f59e0b', 3.5, 16);
              beep(620, 0.05, 'square', 0.02);
            }
            break;
          }
        }
      }
      if(hit) bullets.splice(i,1);
    }

    for(var n=enemyBullets.length-1;n>=0;n--){
      var eb = enemyBullets[n];
      eb.x += eb.vx; eb.y += eb.vy; eb.life--;
      var ehit = eb.life <= 0;

      if(!ehit){
        for(var q=0;q<solids.length;q++){
          var ss = solids[q];
          if(ss._hidden) continue;
          if(eb.x > ss.x && eb.x < ss.x+ss.w && eb.y > ss.y && eb.y < ss.y+ss.h){ ehit = true; break; }
        }
      }
      if(!ehit && state.mode === 'play'){
        if(rectHit({x:eb.x-3,y:eb.y-3,w:6,h:6}, player)){
          ehit = true;
          if(player.invTimer <= 0){
            player.hp--;
            player.invTimer = 60;
            addParticles(player.x+7, player.y+11, 10, '#e94560', 4, 20);
            beep(320, 0.09, 'sawtooth', 0.03);
            if(player.hp <= 0) killPlayer();
          }
        }
      }
      if(ehit) enemyBullets.splice(n,1);
    }
  }

  /* ---------- 敌人 ---------- */
  function updateEnemies(){
    for(var i=0;i<enemies.length;i++){
      var e = enemies[i];
      if(!e.alive) continue;

      var triggerMove = false, hasMoveTrigger = false;
      if (e.hitboxes) {
        for(var j=0; j<e.hitboxes.length; j++){
          var hb = e.hitboxes[j];
          if (hb.triggerMove) {
            hasMoveTrigger = true;
            var heTc = hb.triggerCount || 0;
            if (heTc === 0) {
              if (rectHit(player, getHitboxRect(e, hb, state.t))) triggerMove = true;
            } else if (hb._hits >= heTc) {
              triggerMove = true;
            }
          }
        }
      }
      e._activeMove = hasMoveTrigger ? triggerMove : true;

      if(e.type === 'walker'){
        if (e._activeMove) {
          if (e.path && e.path.length >= 2) {
            updatePath(e);
          } else {
            e.x += e.vx;
            if(e.x < e.minX){ e.x = e.minX; e.vx *= -1; }
            if(e.x + e.w > e.maxX){ e.x = e.maxX - e.w; e.vx *= -1; }
          }
        }
      } else if(e.type === 'shooter'){
        if (e._activeMove) {
          if (e.path && e.path.length >= 2) {
            updatePath(e);
          } else {
            e.phase += 0.05;
            e.y = e.baseY + Math.sin(e.phase) * 14;
          }
        }
        e.cd--;
        if(e.cd <= 0 && state.mode === 'play' && !e._hidden){
          var dx = (player.x + player.w/2) - (e.x + e.w/2);
          var dy = (player.y + player.h/2) - (e.y + e.h/2);
          var d = Math.hypot(dx, dy) || 1;
          if(d < 540){
            var sp = 4.2;
            enemyBullets.push({ x: e.x + e.w/2, y: e.y + e.h/2, vx: dx/d*sp, vy: dy/d*sp, life: 220 });
            e.cd = 95;
            beep(200, 0.1, 'sawtooth', 0.02);
          } else {
            e.cd = 25;
          }
        }
      }
    }
  }

  /* ---------- 自设尖刺移动 ---------- */
  function updateAdvSpikes(){
    for(var i=0;i<adv_spikes.length;i++){
      var s = adv_spikes[i];

      var triggerMove = false, hasMoveTrigger = false;
      if (s.hitboxes) {
        for(var j=0; j<s.hitboxes.length; j++){
          var h = s.hitboxes[j];
          if (h.triggerMove) {
            hasMoveTrigger = true;
            var hsTc = h.triggerCount || 0;
            if (hsTc === 0) {
              if (rectHit(player, getHitboxRect(s, h, state.t))) triggerMove = true;
            } else if (h._hits >= hsTc) {
              triggerMove = true;
            }
          }
        }
      }
      s._activeMove = hasMoveTrigger ? triggerMove : true;

      if (s._activeMove) {
        if (s.path && s.path.length >= 2) {
          updatePath(s);
        } else {
          s.phase += s.moveSpeed || 0.02;
          if (s.moveType === 'horizontal') s.x = s.ox + Math.sin(s.phase) * s.moveRange;
          if (s.moveType === 'vertical')   s.y = s.oy + Math.sin(s.phase) * s.moveRange;
        }
      }
    }
  }

  function isAdvSpikeVisible(s){
    if(!s._activeVis) return false;
    if(s.visibility === 'always') return true;
    if(s.visibility === 'blink') return Math.floor(state.t * 0.05) % 2 === 0;
    if(s.visibility === 'near'){
      var cx = s.x + s.w/2, cy = s.y + s.h/2;
      var px = player.x + player.w/2, py = player.y + player.h/2;
      return Math.hypot(px - cx, py - cy) < 160;
    }
    return true;
  }

  /* ---------- 碰撞箱触发 ---------- */
  function checkHitboxTriggers(){
    var p = player;
    var allEnts = staticSolids.concat(movers).concat(adv_spikes).concat(enemies);

    for(var i=0; i<allEnts.length; i++){
      allEnts[i]._trigMove = false;
      allEnts[i]._trigVis = false;
    }

    for(var i=0; i<allEnts.length; i++){
      var ent = allEnts[i];
      if(!ent.hitboxes) continue;
      for(var j=0; j<ent.hitboxes.length; j++){
        var hb = ent.hitboxes[j];
        var rect = getHitboxRect(ent, hb, state.t);
        var isCol = rectHit(p, rect);

        if (isCol && !hb._curCollide) hb._hits++;
        hb._curCollide = isCol;

        var tc = hb.triggerCount || 0;
        var canTrig = (tc === 0) ? isCol : (hb._hits >= tc);

        if (canTrig) {
          if (hb.triggerMove) ent._trigMove = true;
          if (hb.triggerVisibility) ent._trigVis = true;
          if (hb.triggerMorph) ent._morphActivated = true;

          if (isCol) {
            if (hb.triggerSlow) p.slowTimer = 20;
            if (hb.triggerFast) p.fastTimer = 20;
            if (hb.triggerBounce && p.bounceCd <= 0){
              p.vx = 0; p.vy = -12; p.bounceCd = 40; beep(600, 0.1, 'sine', 0.05);
            }
          }
        }
      }
    }

    for(var i=0; i<allEnts.length; i++){
      var ent = allEnts[i];
      if(ent.hitboxes && ent.hitboxes.length > 0){
        var hasVisTrigger = false;
        for(var j=0; j<ent.hitboxes.length; j++){
          if(ent.hitboxes[j].triggerVisibility) hasVisTrigger = true;
        }
        if (hasVisTrigger && !ent._trigVis) ent._hidden = true;
        else ent._hidden = false;
      }
    }
  }

  /* ---------- 危险检测 ---------- */
  function checkHazards(){
    var p = player, i;

    for(i=0;i<spikes.length;i++){
      var s = spikes[i];
      var spx = Math.min(3, s.w * 0.25), spy = Math.min(7, s.h * 0.4);
      if(rectHit(p, {
        x: s.x + spx, y: s.y + spy,
        w: Math.max(1, s.w - spx*2), h: Math.max(1, s.h - spy)
      })){ killPlayer(); return; }
    }

    for(i=0;i<enemies.length;i++){
      var e = enemies[i];
      if(!e.alive || e._hidden) continue;
      var epx = Math.min(3, e.w * 0.25), epy = Math.min(3, e.h * 0.25);
      if(rectHit(p, {
        x: e.x + epx, y: e.y + epy,
        w: Math.max(1, e.w - epx*2), h: Math.max(1, e.h - epy*2)
      })){
        if (p.invTimer <= 0) {
          p.hp -= (e.damage || 1);
          p.invTimer = 60;
          addParticles(p.x+7, p.y+11, 10, '#e94560', 4, 20);
          beep(300, 0.1, 'sawtooth', 0.03);
          if (p.hp <= 0) { killPlayer(); return; }
        }
      }
    }

    if(p.y > H + 120){ killPlayer(); return; }

    for(i=0;i<adv_spikes.length;i++){
      var s2 = adv_spikes[i];
      var triggerVis = false, triggerDmg = false;
      var hasVisTrigger = false, hasDmgTrigger = false;

      if (s2.hitboxes) {
        for(var j=0; j<s2.hitboxes.length; j++){
          var h = s2.hitboxes[j];
          if (h.triggerVisibility) hasVisTrigger = true;
          if (h.triggerDamage) hasDmgTrigger = true;

          var tc = h.triggerCount || 0;
          var colNow = rectHit(player, getHitboxRect(s2, h, state.t));
          var canTrig = (tc === 0) ? colNow : (h._hits >= tc);
          if (canTrig) {
            if (h.triggerVisibility) triggerVis = true;
            if (h.triggerDamage) triggerDmg = true;
          }
        }
      }

      s2._activeVis = hasVisTrigger ? triggerVis : true;
      s2._activeDmg = hasDmgTrigger ? triggerDmg : true;

      if (s2._activeVis && isAdvSpikeVisible(s2)) {
        var hitSpike = false;
        if (hasDmgTrigger) {
          for(var j2=0; j2<s2.hitboxes.length; j2++){
            var h2 = s2.hitboxes[j2];
            if (!h2.triggerDamage) continue;
            var tcd = h2.triggerCount || 0;
            var dmgRect = getHitboxRect(s2, h2, state.t);
            var colDmg = rectHit(player, dmgRect);
            if (tcd === 0) { if (colDmg) { hitSpike = true; break; } }
            else if (h2._hits >= tcd && colDmg) { hitSpike = true; break; }
          }
        } else {
          var apx = Math.min(3, s2.w * 0.25), apy = Math.min(3, s2.h * 0.25);
          if(rectHit(player, {
            x: s2.x + apx, y: s2.y + apy,
            w: Math.max(1, s2.w - apx*2), h: Math.max(1, s2.h - apy*2)
          })) hitSpike = true;
        }

        if (hitSpike) {
          if (player.invTimer <= 0) {
            player.hp -= s2.damage;
            player.invTimer = 60;
            addParticles(player.x+7, player.y+11, 10, '#e94560', 4, 20);
            beep(300, 0.1, 'sawtooth', 0.03);
            if(player.hp <= 0){ killPlayer(); return; }
          }
        }
      }
    }

    for(i=0;i<checkpoints.length;i++){
      var c = checkpoints[i];
      if(!c.active){
        var hit = false;
        if (c.type === 'trigger') {
          if (player.x + player.w > c.x) hit = true;
        } else {
          hit = rectHit(p, c);
        }
        if (hit) {
          c.active = true;
          state.spawn = { x: c.spawnX, y: c.spawnY };
          addParticles(c.x + c.w/2, c.y + c.h/2, 18, '#4ade80', 4, 36);
          beep(520, 0.1, 'sine', 0.03);
          setTimeout(function(){ beep(780, 0.12, 'sine', 0.03); }, 90);
        }
      }
    }

    if(rectHit(p, goal)){
      state.mode = 'win';
      state.winTimer = 0;
      addParticles(goal.x + goal.w/2, goal.y + goal.h/2, 40, '#fde047', 7, 50);
      beep(660, 0.15, 'sine', 0.04);
      setTimeout(function(){ beep(880, 0.15, 'sine', 0.04); }, 140);
      setTimeout(function(){ beep(1100, 0.25, 'sine', 0.04); }, 280);
    }
  }

  /* ---------- 死亡 / 复活 ---------- */
  function killPlayer(){
    if(state.mode !== 'play') return;
    state.mode = 'dead';
    state.deadTimer = 28;
    state.deaths++;
    state.shake = 14;
    addParticles(player.x + player.w/2, player.y + player.h/2, 26, '#e94560', 6.5, 40);
    addParticles(player.x + player.w/2, player.y + player.h/2, 14, '#ffffff', 4, 24);
    beep(140, 0.28, 'sawtooth', 0.045);
  }

  function respawn(){
    player.x = state.spawn.x;
    player.y = state.spawn.y;
    player.vx = 0; player.vy = 0;
    player.jumpsLeft = 1; player.coyote = 0; player.jumpBuffer = 0;
    player.onGround = false; player.ground = null; player.shootCd = 0;
    player.hp = player.maxHp; player.invTimer = 0;
    player.slowTimer = 0; player.fastTimer = 0; player.bounceCd = 0;

    enemyBullets.length = 0;
    state.mode = 'play';
    state.camX = clamp(player.x + player.w/2 - W/2, 0, Math.max(0, WORLD_W - W));
    addParticles(player.x + player.w/2, player.y + player.h/2, 16, '#5eead4', 4, 28);

    var allEnts = staticSolids.concat(movers).concat(adv_spikes).concat(enemies);
    for(var i=0; i<allEnts.length; i++) {
      var ent = allEnts[i];
      var shouldReset = false;
      if(ent.hitboxes) {
        for(var j=0; j<ent.hitboxes.length; j++) {
          var hb = ent.hitboxes[j];
          hb._curCollide = false;
          if (hb.resetOnDeath || hb.resetOnDeath === undefined) {
            hb._hits = 0;
            shouldReset = true;
          }
        }
      }
      if (shouldReset) {
        if (ent.path) ent.pathDist = 0;
        ent.phase = 0;
        ent._morphActivated = false;
        ent._morphStartT = undefined;
        ent._morphOffX = 0;
        ent._morphOffY = 0;
        if (ent.ow !== undefined) ent.w = ent.ow;
        if (ent.oh !== undefined) ent.h = ent.oh;
        if (ent.ox !== undefined) ent.x = ent.ox;
        if (ent.oy !== undefined) ent.y = ent.oy;
      }
    }

    for(var i=0; i<enemies.length; i++){
      var en = enemies[i];
      if (en.resetOnDeath !== false) {
        en.alive = true;
        en.hp = en.maxHp !== undefined ? en.maxHp : 1;
      }
    }

    for(var i=0; i<adv_spikes.length; i++){
      adv_spikes[i]._activeVis = false;
      adv_spikes[i]._activeDmg = false;
    }
    for(var i=0; i<movers.length; i++){
      movers[i]._activeMove = false;
    }
  }

  /* ---------- 主更新 ---------- */
  function update(){
    state.t++;
    updateMovers();
    updateAdvSpikes();
    updateMorphs();

    if(state.mode === 'play'){
      updatePlayer();
    } else if(state.mode === 'dead'){
      state.deadTimer--;
      if(state.deadTimer <= 0) respawn();
    } else if(state.mode === 'win'){
      state.winTimer++;
      if(!winTriggered){
        winTriggered = true;
        if(typeof onWinCallback === 'function') onWinCallback(state.deaths);
      }
    }

    updateBullets();
    updateEnemies();
    updateParticles();

    if(state.mode !== 'win'){
      var targetX = clamp(player.x + player.w/2 - W/2 + player.vx * 6, 0, Math.max(0, WORLD_W - W));
      state.camX += (targetX - state.camX) * 0.12;
    }

    if(state.shake > 0.1) state.shake *= 0.87;
    else state.shake = 0;
  }

  /* ---------- 背景星 ---------- */
  var stars = [];
  for(var si=0;si<160;si++){
    stars.push({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*1.6 + 0.3,
      d: Math.random()*0.7 + 0.15,
      a: Math.random()*0.6 + 0.25
    });
  }

  function drawBackground(){
    var g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#07070f'); g.addColorStop(0.55,'#100e1e'); g.addColorStop(1,'#1c1330');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    for(var i=0;i<stars.length;i++){
      var s = stars[i];
      var x = s.x - state.camX * s.d;
      x = ((x % W) + W) % W;
      ctx.globalAlpha = s.a;
      ctx.fillStyle = '#9fb4ff';
      ctx.fillRect(x, s.y, s.r, s.r);
    }
    ctx.globalAlpha = 1;

    var mx = 780 - state.camX * 0.08;
    ctx.globalAlpha = 0.55;
    var mg = ctx.createRadialGradient(mx, 110, 10, mx, 110, 90);
    mg.addColorStop(0, 'rgba(160,180,255,0.45)');
    mg.addColorStop(1, 'rgba(160,180,255,0)');
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(mx, 110, 90, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;

    ctx.fillStyle = '#20264a'; ctx.beginPath(); ctx.arc(mx, 110, 42, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2b3260'; ctx.beginPath(); ctx.arc(mx - 14, 100, 8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(mx + 12, 124, 5, 0, Math.PI*2); ctx.fill();
  }

  function drawSolids(){
    for(var i=0;i<solids.length;i++){
      var s = solids[i];
      if(s._hidden) continue;
      if(s.x + s.w < state.camX - 120 || s.x > state.camX + W + 120) continue;
      var isMover = movers.indexOf(s) >= 0;

      ctx.fillStyle = isMover ? '#3b2f5e' : '#242440';
      ctx.fillRect(s.x, s.y, s.w, s.h);
      ctx.fillStyle = isMover ? '#8b6ee8' : '#4d4d7d';
      ctx.fillRect(s.x, s.y, s.w, 3);
      ctx.fillStyle = isMover ? '#a78bfa' : '#6a6aa8';
      ctx.fillRect(s.x, s.y, s.w, 1);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(s.x, s.y + s.h - 3, s.w, 3);
    }
  }

  function drawSpikes(){
    for(var i=0;i<spikes.length;i++){
      var s = spikes[i];
      if(s.x + s.w < state.camX - 120 || s.x > state.camX + W + 120) continue;
      var n = Math.max(1, Math.round(s.w / 14));
      var tw = s.w / n;
      for(var j=0;j<n;j++){
        var x = s.x + j*tw;
        ctx.beginPath();
        ctx.moveTo(x, s.y + s.h);
        ctx.lineTo(x + tw/2, s.y);
        ctx.lineTo(x + tw, s.y + s.h);
        ctx.closePath();
        ctx.fillStyle = '#e94560'; ctx.fill();

        ctx.beginPath();
        ctx.moveTo(x + tw/2, s.y);
        ctx.lineTo(x + tw*0.72, s.y + s.h);
        ctx.lineTo(x + tw/2, s.y + s.h);
        ctx.closePath();
        ctx.fillStyle = 'rgba(255,180,200,0.45)'; ctx.fill();
      }
    }
  }

  function drawAdvSpikes(layer){
    for(var i=0;i<adv_spikes.length;i++){
      var s = adv_spikes[i];
      if(s.layer !== layer) continue;
      if(s._hidden) continue;
      if(s.x + s.w < state.camX - 120 || s.x > state.camX + W + 120) continue;
      if(!isAdvSpikeVisible(s)) continue;

      var cx = s.x + s.w/2, cy = s.y + s.h/2;
      var rad = Math.max(s.w, s.h) / 2;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.fillStyle = '#ff8c00';
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;

      if (s.shape === 'triangle') {
        var n = 4, tw = s.w / n;
        for(var j=0;j<n;j++){
          var x = -s.w/2 + j*tw;
          ctx.beginPath();
          ctx.moveTo(x, s.h/2);
          ctx.lineTo(x + tw/2, -s.h/2);
          ctx.lineTo(x + tw, s.h/2);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
        }
      } else if (s.shape === 'square') {
        ctx.fillRect(-s.w/2, -s.h/2, s.w, s.h);
        ctx.strokeRect(-s.w/2, -s.h/2, s.w, s.h);
      } else if (s.shape === 'circle') {
        ctx.beginPath();
        ctx.arc(0, 0, rad, 0, Math.PI*2);
        ctx.fill(); ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawCheckpoints(){
    for(var i=0;i<checkpoints.length;i++){
      var c = checkpoints[i];
      if(c.x + c.w < state.camX - 120 || c.x > state.camX + W + 120) continue;

      if (c.type === 'trigger') {
        ctx.fillStyle = c.active ? 'rgba(74,222,128,0.2)' : 'rgba(56,189,248,0.2)';
        ctx.fillRect(c.x, c.y, c.w, c.h);
        ctx.fillStyle = c.active ? '#4ade80' : '#38bdf8';
        ctx.fillRect(c.x + c.w/2 - 1, c.y, 2, c.h);
        if(c.active){
          ctx.globalAlpha = 0.25 + Math.sin(state.t*0.1)*0.12;
          ctx.fillStyle = '#4ade80';
          ctx.beginPath(); ctx.arc(c.x + c.w/2, c.y + c.h/2, 20, 0, Math.PI*2); ctx.fill();
          ctx.globalAlpha = 1;
        }
      } else {
        ctx.fillStyle = c.active ? '#9aa4c0' : '#4a4a68';
        ctx.fillRect(c.x + c.w/2 - 2, c.y, 4, c.h);

        var wave = Math.sin(state.t * 0.08) * 3;
        ctx.beginPath();
        ctx.moveTo(c.x + c.w/2 + 2, c.y + 4);
        ctx.lineTo(c.x + c.w/2 + 24, c.y + 12 + wave);
        ctx.lineTo(c.x + c.w/2 + 2, c.y + 22);
        ctx.closePath();
        ctx.fillStyle = c.active ? '#4ade80' : '#3a3a55';
        ctx.fill();

        if(c.active){
          ctx.globalAlpha = 0.25 + Math.sin(state.t*0.1)*0.12;
          ctx.fillStyle = '#4ade80';
          ctx.beginPath(); ctx.arc(c.x + c.w/2, c.y + 20, 22, 0, Math.PI*2); ctx.fill();
          ctx.globalAlpha = 1;
        }
      }
    }
  }

  function drawGoal(){
    var g = goal;
    if(g.x + g.w < state.camX - 160 || g.x > state.camX + W + 160) return;

    var pulse = Math.sin(state.t * 0.09) * 0.5 + 0.5;
    var rg = ctx.createRadialGradient(g.x + g.w/2, g.y + g.h/2, 4, g.x + g.w/2, g.y + g.h/2, 70);
    rg.addColorStop(0, 'rgba(253,224,71,' + (0.35 + pulse*0.25) + ')');
    rg.addColorStop(1, 'rgba(253,224,71,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(g.x - 60, g.y - 60, g.w + 120, g.h + 120);

    ctx.fillStyle = '#fde047'; ctx.fillRect(g.x, g.y, g.w, g.h);
    ctx.fillStyle = '#0b0b18'; ctx.fillRect(g.x + 5, g.y + 5, g.w - 10, g.h - 5);

    ctx.globalAlpha = 0.5 + pulse * 0.5;
    ctx.fillStyle = '#fef9c3';
    for(var i=0;i<4;i++) ctx.fillRect(g.x + 9, g.y + 14 + i*16, g.w - 18, 3);
    ctx.globalAlpha = 1;
  }

  function drawEnemies(){
    for(var i=0;i<enemies.length;i++){
      var e = enemies[i];
      if(!e.alive || e._hidden) continue;
      if(e.x + e.w < state.camX - 120 || e.x > state.camX + W + 120) continue;

      if(e.type === 'walker'){
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(e.x, e.y, e.w, e.h);
        ctx.fillStyle = '#b45309';
        ctx.fillRect(e.x, e.y + e.h - 6, e.w, 6);
        ctx.fillStyle = '#1a0a00';
        var ex = e.vx > 0 ? e.x + e.w - 9 : e.x + 3;
        ctx.fillRect(ex, e.y + 8, 5, 5);
        ctx.fillStyle = '#fff7ed';
        ctx.fillRect(e.x + 5, e.y + e.h - 12, 3, 4);
        ctx.fillRect(e.x + e.w - 9, e.y + e.h - 12, 3, 4);

        if (e.maxHp > 1) {
          var pct = clamp(e.hp / e.maxHp, 0, 1);
          ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(e.x, e.y - 6, e.w, 3);
          ctx.fillStyle = '#e94560'; ctx.fillRect(e.x, e.y - 6, e.w * pct, 3);
        }
      } else if(e.type === 'shooter'){
        var cx = e.x + e.w/2, cy = e.y + e.h/2;
        var rg = ctx.createRadialGradient(cx, cy, 2, cx, cy, 26);
        rg.addColorStop(0, 'rgba(233,69,96,0.5)');
        rg.addColorStop(1, 'rgba(233,69,96,0)');
        ctx.fillStyle = rg;
        ctx.beginPath(); ctx.arc(cx, cy, 26, 0, Math.PI*2); ctx.fill();

        ctx.fillStyle = '#e94560';
        ctx.beginPath(); ctx.arc(cx, cy, e.w/2, 0, Math.PI*2); ctx.fill();

        ctx.fillStyle = '#1a0a12';
        ctx.beginPath(); ctx.arc(cx, cy, e.w/4, 0, Math.PI*2); ctx.fill();

        var pulse = Math.sin(state.t*0.15)*0.5+0.5;
        ctx.fillStyle = 'rgba(255,220,120,' + (0.5+pulse*0.5) + ')';
        ctx.beginPath(); ctx.arc(cx, cy, 3.5 + pulse*1.5, 0, Math.PI*2); ctx.fill();

        if (e.maxHp > 1) {
          var pct2 = clamp(e.hp / e.maxHp, 0, 1);
          ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(e.x, e.y - 6, e.w, 3);
          ctx.fillStyle = '#e94560'; ctx.fillRect(e.x, e.y - 6, e.w * pct2, 3);
        }
      }
    }
  }

  function drawBullets(){
    for(var i=0;i<bullets.length;i++){
      var b = bullets[i];
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vy, b.vx));
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = '#fde047'; ctx.fillRect(-14, -1.5, 14, 3);
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#fef08a'; ctx.fillRect(-3, -2.5, 8, 5);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, -1.5, 4, 3);
      ctx.restore();
    }
    for(var j=0;j<enemyBullets.length;j++){
      var eb = enemyBullets[j];
      var rg = ctx.createRadialGradient(eb.x, eb.y, 0, eb.x, eb.y, 10);
      rg.addColorStop(0, 'rgba(255,120,160,1)');
      rg.addColorStop(1, 'rgba(233,69,96,0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(eb.x, eb.y, 10, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ff6b8a';
      ctx.beginPath(); ctx.arc(eb.x, eb.y, 4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(eb.x, eb.y, 1.8, 0, Math.PI*2); ctx.fill();
    }
  }

  function drawPlayer(){
    var p = player;

    if(state.mode === 'dead'){
      var t = 1 - state.deadTimer / 28;
      ctx.globalAlpha = Math.max(0, 1 - t*1.4);
      ctx.fillStyle = '#e94560';
      ctx.fillRect(p.x - 4*t, p.y - 4*t, p.w + 8*t, p.h + 8*t);
      ctx.globalAlpha = 1;
      return;
    }

    if(state.mode === 'win') ctx.globalAlpha = 0.6 + Math.sin(state.t*0.3)*0.4;
    if(p.invTimer > 0 && Math.floor(state.t/4)%2===0) { ctx.globalAlpha = 0.3; }

    var cx = p.x + p.w/2, cy = p.y + p.h/2;
    var rg = ctx.createRadialGradient(cx, cy, 2, cx, cy, 24);
    rg.addColorStop(0, 'rgba(94,234,212,0.28)');
    rg.addColorStop(1, 'rgba(94,234,212,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(cx, cy, 24, 0, Math.PI*2); ctx.fill();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(p.aimAngle);
    ctx.fillStyle = '#94a3b8'; ctx.fillRect(2, -2.5, 14, 5);
    ctx.fillStyle = '#e2e8f0'; ctx.fillRect(12, -2, 5, 4);
    ctx.restore();

    ctx.fillStyle = '#5eead4';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.strokeStyle = '#0d9488';
    ctx.lineWidth = 1;
    ctx.strokeRect(p.x + 0.5, p.y + 0.5, p.w - 1, p.h - 1);

    ctx.fillStyle = '#062a26';
    if(p.facing >= 0){
      ctx.fillRect(p.x + p.w - 7, p.y + 5, 3, 4);
      ctx.fillRect(p.x + p.w - 3, p.y + 5, 2, 4);
    } else {
      ctx.fillRect(p.x + 2, p.y + 5, 3, 4);
      ctx.fillRect(p.x + 6, p.y + 5, 2, 4);
    }
    ctx.fillStyle = '#0d9488';
    ctx.fillRect(p.x - 1, p.y + p.h - 6, p.w + 2, 3);
    ctx.globalAlpha = 1;
  }

  function drawParticles(){
    for(var i=0;i<particles.length;i++){
      var p = particles[i];
      var a = clamp(p.life / p.maxLife, 0, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      var s = p.size * (0.4 + a * 0.6);
      ctx.fillRect(p.x - s/2, p.y - s/2, s, s);
    }
    ctx.globalAlpha = 1;
  }

  function roundRect(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function drawHUD(){
    ctx.fillStyle = 'rgba(10,10,20,0.65)';
    roundRect(14, 14, 192, 36, 6); ctx.fill();
    ctx.strokeStyle = 'rgba(120,150,255,0.3)';
    ctx.lineWidth = 1;
    roundRect(14.5, 14.5, 191, 35, 6); ctx.stroke();

    ctx.fillStyle = '#e94560';
    ctx.font = 'bold 16px "Courier New",monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('☠ 死亡', 26, 33);
    ctx.fillStyle = '#e2e8f0';
    ctx.fillText(('00' + state.deaths).slice(-3), 118, 33);

    if (player.maxHp <= 8) {
      for (var i=0; i<player.maxHp; i++) {
        ctx.beginPath();
        var hx = 155 + i * 12, hy = 33;
        ctx.arc(hx, hy, 4, 0, Math.PI*2);
        if (i < player.hp) { ctx.fillStyle = '#e94560'; ctx.fill(); }
        else { ctx.strokeStyle = '#e94560'; ctx.lineWidth = 1; ctx.stroke(); }
      }
    } else {
      ctx.font = 'bold 14px "Courier New",monospace';
      ctx.textAlign = 'left';
      ctx.fillStyle = '#e94560';
      ctx.fillText('❤ ' + player.hp + ' / ' + player.maxHp, 155, 33);
    }

    ctx.fillStyle = 'rgba(160,180,220,0.55)';
    ctx.font = '13px "Courier New",monospace';
    ctx.textAlign = 'right';
    if (isTouchDevice) {
      ctx.fillText('左下移动 · 右下跳跃 · 点空白射击', W - 18, 32);
    } else {
      ctx.fillText('A/D 移动 · SPACE 跳跃(二段) · 鼠标射击 · R 重来', W - 18, 32);
    }

    var prog = clamp(player.x / (goal.x || 1), 0, 1);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(W/2 - 180, H - 22, 360, 5);
    ctx.fillStyle = '#5eead4';
    ctx.fillRect(W/2 - 180, H - 22, 360 * prog, 5);
    ctx.fillStyle = '#fde047';
    ctx.fillRect(W/2 + 177, H - 26, 6, 13);
    ctx.fillStyle = '#5eead4';
    ctx.beginPath(); ctx.arc(W/2 - 180 + 360*prog, H - 19.5, 4, 0, Math.PI*2); ctx.fill();

    // 准星：触屏时显示在触摸位置，否则鼠标位置
    var mx = touchAimActive ? aimLogicX : mouse.x;
    var my = touchAimActive ? aimLogicY : mouse.y;
    ctx.strokeStyle = 'rgba(253,224,71,0.85)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(mx, my, 9, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(mx - 15, my); ctx.lineTo(mx - 5, my);
    ctx.moveTo(mx + 5, my);  ctx.lineTo(mx + 15, my);
    ctx.moveTo(mx, my - 15); ctx.lineTo(mx, my - 5);
    ctx.moveTo(mx, my + 5);  ctx.lineTo(mx, my + 15);
    ctx.stroke();
  }

  function drawDeadOverlay(){
    if(state.mode === 'dead'){
      var a = (state.deadTimer / 28) * 0.35;
      ctx.fillStyle = 'rgba(233,69,96,' + a + ')';
      ctx.fillRect(0,0,W,H);
    }
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    drawBackground();

    var sx = state.shake > 0.2 ? rnd(-state.shake, state.shake) : 0;
    var sy = state.shake > 0.2 ? rnd(-state.shake, state.shake) : 0;

    ctx.save();
    ctx.translate(-Math.round(state.camX) + sx, sy);
    drawSolids();
    drawSpikes();
    drawCheckpoints();
    drawGoal();
    drawAdvSpikes('bottom');
    drawEnemies();
    drawBullets();
    drawPlayer();
    drawAdvSpikes('top');
    drawParticles();
    ctx.restore();

    drawHUD();
    drawDeadOverlay();
  }

  /* ---------- 主循环 ---------- */
  var lastTime = performance.now();
  var accumulator = 0;
  var STEP = 1000 / 60;

  function loop(now){
    if(!running) return;
    rafId = requestAnimationFrame(loop);

    var delta = now - lastTime;
    lastTime = now;
    if(delta > 100) delta = 100;
    accumulator += delta;

    var guard = 0;
    while(accumulator >= STEP && guard < 5){
      update();
      accumulator -= STEP;
      guard++;
    }
    if(guard >= 5) accumulator = 0;

    render();
  }

  state.camX = 0;
  rafId = requestAnimationFrame(loop);

  return {
    stop: function(){
      running = false;
      if(rafId) cancelAnimationFrame(rafId);
      rafId = null;
      for(var i = 0; i < listeners.length; i++){
        var l = listeners[i];
        try{ l.target.removeEventListener(l.event, l.fn, l.opts); }catch(e){}
      }
      listeners = [];
      // 清理按钮 active 状态
      var bl = document.getElementById('btn-left');
      var br = document.getElementById('btn-right');
      var bj = document.getElementById('btn-jump');
      if(bl) bl.classList.remove('active');
      if(br) br.classList.remove('active');
      if(bj) bj.classList.remove('active');
    }
  };
}

/* ============================================================
 *  启动
 * ============================================================ */
(function init(){
  refreshLevelList();

  var levelUrl = null;
  try{ levelUrl = new URLSearchParams(location.search).get('level'); }catch(e){}

  if(levelUrl){
    statusEl.textContent = '正在从 URL 加载关卡...';
    fetch(levelUrl)
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function(txt){
        var nm = levelUrl.split('/').pop().replace(/\.json$/i, '');
        currentLevelIndex = -1;
        loadAndStart(txt, nm);
      })
      .catch(function(e){
        statusEl.textContent = '自动加载失败：' + e.message;
        statusEl.classList.add('error');
      });
    return;
  }
})();

})();
</script>
</body>
