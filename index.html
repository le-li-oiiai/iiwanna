<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Wanna Shoot · 选关</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;width:100%;background:#05050c;color:#c8d0e8;
    font-family:'Courier New',Consolas,monospace;font-size:13px;overflow:hidden;}

  /* ========== 选关界面 ========== */
  #menu{
    position:fixed;inset:0;overflow-y:auto;
    background:radial-gradient(circle at 50% 0%,#151535,#05050c 60%);
    z-index:100;
  }
  #menu.hidden{display:none;}
  .menu-inner{max-width:820px;margin:0 auto;padding:34px 20px 40px;}

  .menu-head{text-align:center;margin-bottom:26px;}
  .menu-head h1{
    color:#5eead4;font-size:28px;letter-spacing:2px;
    text-shadow:0 0 24px rgba(94,234,212,.5);margin-bottom:6px;
  }
  .menu-head .sub{color:#6a7290;font-size:12px;letter-spacing:3px;}

  .section{
    background:#0f0f1c;border:1px solid #1f1f38;border-radius:10px;
    padding:16px 18px;margin-bottom:16px;
    box-shadow:0 6px 30px rgba(0,0,0,.4);
  }
  .sec-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #1f1f38;
  }
  .sec-title{
    color:#6a7290;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;
  }
  .btn-sm{
    background:#161628;border:1px solid #2a2a4a;color:#c8d0e8;
    padding:5px 10px;border-radius:5px;cursor:pointer;font-family:inherit;
    font-size:11px;transition:.13s;
  }
  .btn-sm:hover{background:#232340;border-color:#3d3d66;color:#fff;}

  .levels-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:10px;min-height:60px;
  }
  .level-card{
    background:linear-gradient(145deg,#151528,#111122);
    border:1px solid #2a2a4a;border-radius:8px;padding:14px 12px;
    cursor:pointer;position:relative;transition:.18s;overflow:hidden;
    min-height:78px;display:flex;flex-direction:column;justify-content:center;
  }
  .level-card::before{
    content:'';position:absolute;inset:0;opacity:0;transition:.18s;
    background:radial-gradient(circle at 50% 50%,rgba(94,234,212,.12),transparent 70%);
  }
  .level-card:hover{
    border-color:#5eead4;transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(94,234,212,.18);
  }
  .level-card:hover::before{opacity:1;}
  .card-badge{
    position:absolute;top:8px;right:8px;font-size:9px;letter-spacing:1px;
    padding:2px 6px;border-radius:3px;background:#1a1a2e;color:#6a7290;
    border:1px solid #2a2a4a;
  }
  .level-card:hover .card-badge{background:#123a35;color:#7dfbe1;border-color:#1e6b5e;}
  .card-name{
    color:#e2e8f0;font-size:13px;font-weight:bold;word-break:break-all;
    padding-right:44px;line-height:1.4;
  }
  .card-actions{position:absolute;bottom:6px;right:6px;display:flex;gap:4px;}
  .card-del{
    background:rgba(233,69,96,.12);border:1px solid rgba(233,69,96,.35);
    color:#e94560;width:20px;height:20px;border-radius:4px;cursor:pointer;
    font-size:11px;line-height:1;padding:0;transition:.13s;
  }
  .card-del:hover{background:#e94560;color:#fff;border-color:#e94560;}

  .empty-tip{
    grid-column:1/-1;text-align:center;color:#4a5270;font-size:12px;
    padding:22px 10px;line-height:1.8;
  }
  .empty-tip span{font-size:11px;opacity:.75;}

  .status{
    margin-top:10px;font-size:11px;color:#4a5270;text-align:center;
    min-height:16px;line-height:1.4;word-break:break-all;
  }
  .status.error{color:#e94560;}

  .hint-text{
    color:#6a7290;font-size:11px;line-height:1.7;margin-bottom:10px;
  }

  textarea{
    width:100%;background:#0a0a14;border:1px solid #26263f;color:#c8d0e8;
    padding:9px 11px;border-radius:6px;font-family:inherit;font-size:11px;
    resize:vertical;min-height:80px;outline:none;line-height:1.5;
  }
  textarea:focus{border-color:#3d3d66;background:#0f0f1e;}

  .row{
    display:flex;gap:8px;margin-top:8px;align-items:stretch;
  }
  .row input{
    flex:1;background:#0a0a14;border:1px solid #26263f;color:#c8d0e8;
    padding:8px 11px;border-radius:6px;font-family:inherit;font-size:12px;outline:none;
  }
  .row input:focus{border-color:#3d3d66;background:#0f0f1e;}

  .btn{
    background:#16302e;color:#7dfbe1;border:1px solid #2a5f57;
    padding:8px 16px;border-radius:6px;cursor:pointer;font-family:inherit;
    font-size:12px;transition:.13s;letter-spacing:.4px;white-space:nowrap;
  }
  .btn:hover{background:#175c53;border-color:#2a9b88;color:#a7fff0;}
  .btn:active{transform:translateY(1px);}
  .btn.ghost{background:#1a1a2e;color:#a0a8c8;border-color:#2f2f4d;}
  .btn.ghost:hover{background:#252540;color:#fff;}

  .menu-foot{
    text-align:center;color:#3a3f58;font-size:10px;
    margin-top:20px;line-height:1.8;
  }
  .menu-foot kbd{
    background:#1a1a2e;color:#7dfbe1;border:1px solid #2a2a4a;
    padding:1px 5px;border-radius:3px;font-size:10px;
  }

  /* ========== 游戏界面 ========== */
  #wrap{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(100vw,177.78vh);aspect-ratio:960/540;
    box-shadow:0 0 80px rgba(90,130,255,.25),0 0 0 1px rgba(120,150,255,.15);
    border-radius:8px;overflow:hidden;display:none;
  }
  #wrap.visible{display:block;}
  canvas{display:block;width:100%;height:100%;cursor:crosshair;}

  #exit-btn{
    position:fixed;top:10px;right:12px;z-index:60;
    background:rgba(20,20,40,.85);color:#c8d0e8;border:1px solid #26263f;
    padding:6px 12px;border-radius:6px;cursor:pointer;font-family:inherit;
    font-size:11px;transition:.13s;display:none;backdrop-filter:blur(4px);
  }
  #exit-btn.visible{display:block;}
  #exit-btn:hover{background:#252540;color:#fff;border-color:#3d3d66;}

  /* ========== 通关浮层 ========== */
  #win-overlay{
    position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    background:rgba(5,5,15,.85);backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;transition:opacity .4s;
  }
  #win-overlay.visible{
    opacity:1;pointer-events:auto;
  }
  .win-title{
    font-size:56px;color:#fde047;text-shadow:0 0 30px #fde047;
    margin-bottom:10px;animation: bounceWin 1.5s infinite alternate;
  }
  @keyframes bounceWin {
    from { transform: translateY(0); }
    to { transform: translateY(-12px); }
  }
  .win-sub{
    font-size:18px;color:#e2e8f0;margin-bottom:40px;
  }
  .win-actions{
    display:flex;gap:16px;
  }
  .win-actions .btn{ padding: 10px 24px; font-size: 14px; }

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#252540;border-radius:4px;}
  ::-webkit-scrollbar-thumb:hover{background:#343460;}
</style>
</head>
<body>

<!-- ============ 选关界面 ============ -->
<div id="menu">
  <div class="menu-inner">
    <header class="menu-head">
      <h1>🎮 I WANNA SHOOT</h1>
      <p class="sub">S E L E C T   L E V E L</p>
    </header>

    <div class="section">
      <div class="sec-head">
        <span class="sec-title">可用关卡</span>
        <button class="btn-sm" id="btn-refresh">🔄 刷新列表</button>
      </div>
      <div id="levels-grid" class="levels-grid"></div>
      <div id="levels-status" class="status"></div>
    </div>

    <div class="section">
      <div class="sec-head">
        <span class="sec-title">添加关卡</span>
      </div>
      <p class="hint-text">
        想分享关卡给朋友？把 <kbd>.json</kbd> 文件上传到本页面同目录，并在 <kbd>levels.json</kbd> 里登记。<br>
        或者直接粘贴文本保存在你的浏览器本地。
      </p>
      <textarea id="paste-box" placeholder="粘贴编辑器导出的关卡 JSON 文本..."></textarea>
      <div class="row">
        <input id="level-name" type="text" placeholder="关卡名称（可选）">
        <button class="btn" id="btn-save-local">💾 保存到本地</button>
        <button class="btn ghost" id="btn-download">⬇ 下载 JSON</button>
      </div>
    </div>

    <footer class="menu-foot">
      用编辑器设计关卡 → 保存 JSON → 上传到本页面同目录<br>
      也可以用 <kbd>?level=xxx.json</kbd> 直接分享单个关卡链接
    </footer>
  </div>
</div>

<!-- ============ 游戏 ============ -->
<div id="wrap">
  <canvas id="game"></canvas>
  
  <!-- 通关浮层 -->
  <div id="win-overlay">
    <h2 class="win-title">🏆 YOU WIN!</h2>
    <div class="win-sub">死亡次数: <span id="win-deaths">0</span></div>
    <div class="win-actions">
      <button id="btn-back-menu" class="btn ghost">返回选关</button>
      <button id="btn-next-level" class="btn">下一关 ▶</button>
    </div>
  </div>
</div>
<button id="exit-btn">✕ 退出关卡</button>

<script>
(function(){
"use strict";

var $ = function(id){ return document.getElementById(id); };

var menuEl   = $('menu');
var wrapEl   = $('wrap');
var exitBtn  = $('exit-btn');
var gridEl   = $('levels-grid');
var statusEl = $('levels-status');
var pasteBox = $('paste-box');
var nameInput= $('level-name');

var winOverlay = $('win-overlay');
var winDeathsEl = $('win-deaths');
var btnNextLevel = $('btn-next-level');
var btnBackMenu = $('btn-back-menu');

var currentGame = null;
var allLevels = [];           // 保存当前所有可用关卡的顺序
var currentLevelIndex = -1;   // 玩家当前正在玩的关卡在列表中的索引

/* ============================================================
   localStorage 关卡（本机保存）
   ============================================================ */
var LS_INDEX = 'iwsl_index';
var LS_DATA_PREFIX = 'iwsl_data_';

function getLocalIndex(){
  try{ return JSON.parse(localStorage.getItem(LS_INDEX) || '[]'); }catch(e){ return []; }
}
function saveLocalIndex(idx){ try{ localStorage.setItem(LS_INDEX, JSON.stringify(idx)); }catch(e){} }
function getLocalData(id){ try{ return localStorage.getItem(LS_DATA_PREFIX + id); }catch(e){ return null; } }

function addLocalLevel(name, data){
  var idx = getLocalIndex();
  var id = 'L' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  idx.push({ id:id, name:name, created: Date.now() });
  saveLocalIndex(idx);
  try{ localStorage.setItem(LS_DATA_PREFIX + id, data); }catch(e){ alert('本地存储已满'); }
  return id;
}
function removeLocalLevel(id){
  saveLocalIndex(getLocalIndex().filter(function(x){ return x.id !== id; }));
  try{ localStorage.removeItem(LS_DATA_PREFIX + id); }catch(e){}
}

/* ============================================================
   读取在线关卡列表
   ============================================================ */
function fetchOnlineLevels(){
  return fetch('levels.json?_=' + Date.now())
    .then(function(r){
      if(!r.ok) throw new Error('找不到 levels.json 文件 (HTTP ' + r.status + ')');
      return r.json();
    })
    .then(function(arr){
      if(!Array.isArray(arr)) throw new Error('levels.json 格式错误：必须是一个数组 []');
      
      var list = [];
      arr.forEach(function(item){
        if(typeof item === 'string'){
          list.push({ type:'remote', name: item.replace(/\.json$/i,''), url: item });
        } else if(item && (item.file || item.url)){
          list.push({ type:'remote', name: item.name || item.file || item.url, url: item.url || item.file });
        }
      });
      return list;
    });
}

/* ============================================================
   选关列表渲染
   ============================================================ */
function refreshLevelList(){
  statusEl.textContent = '正在读取关卡列表...';
  statusEl.classList.remove('error');
  gridEl.innerHTML = '';

  var local = getLocalIndex().map(function(x){
    return { type:'local', id:x.id, name:x.name };
  });

  fetchOnlineLevels()
    .then(function(remoteList){
      // 更新全局关卡列表
      allLevels = local.concat(remoteList);

      if(allLevels.length === 0){
        gridEl.innerHTML =
          '<div class="empty-tip">还没有可用的关卡<br>' +
          '<span>请检查 levels.json 是否有内容，或粘贴到下方保存</span></div>';
        statusEl.textContent = '';
        return;
      }

      statusEl.textContent =
        '共 ' + allLevels.length + ' 个关卡（本地 ' + local.length + ' · 在线 ' + remoteList.length + '）';

      allLevels.forEach(function(item, index){
        gridEl.appendChild(buildLevelCard(item, index));
      });
    })
    .catch(function(err){
      // 如果在线获取失败，依然显示本地关卡
      allLevels = local.slice(); // 深拷贝
      if(allLevels.length > 0){
        allLevels.forEach(function(item, index){ gridEl.appendChild(buildLevelCard(item, index)); });
        statusEl.textContent = '在线列表获取失败：' + err.message + '（仅显示本地关卡）';
      } else {
        gridEl.innerHTML =
          '<div class="empty-tip">未能加载在线关卡<br>' +
          '<span>请确保 index.html 同目录下存在 levels.json 且格式正确</span></div>';
        statusEl.textContent = '加载失败：' + err.message;
      }
      statusEl.classList.add('error');
    });
}

function buildLevelCard(item, index){
  var card = document.createElement('div');
  card.className = 'level-card';

  var badge = document.createElement('div');
  badge.className = 'card-badge';
  badge.textContent = item.type === 'local' ? '本地' : '在线';

  var name = document.createElement('div');
  name.className = 'card-name';
  name.textContent = item.name;

  card.appendChild(badge);
  card.appendChild(name);

  if(item.type === 'local'){
    var actions = document.createElement('div');
    actions.className = 'card-actions';
    var delBtn = document.createElement('button');
    delBtn.className = 'card-del';
    delBtn.title = '删除本地关卡';
    delBtn.textContent = '✕';
    delBtn.addEventListener('click', function(e){
      e.stopPropagation();
      if(confirm('删除本地关卡「' + item.name + '」？')){
        removeLocalLevel(item.id);
        refreshLevelList();
      }
    });
    actions.appendChild(delBtn);
    card.appendChild(actions);
  }

  card.addEventListener('click', function(){ enterLevel(item, index); });
  return card;
}

/* ============================================================
   进入 / 退出关卡
   ============================================================ */
function enterLevel(item, index){
  currentLevelIndex = (index !== undefined) ? index : allLevels.indexOf(item);

  if(item.type === 'local'){
    var txt = getLocalData(item.id);
    if(!txt){ alert('本地关卡数据丢失'); refreshLevelList(); return; }
    loadAndStart(txt, item.name);
    return;
  }
  
  statusEl.textContent = '正在加载「' + item.name + '」...';
  statusEl.classList.remove('error');
  
  fetch(item.url + '?_=' + Date.now())
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function(txt){ loadAndStart(txt, item.name); })
    .catch(function(e){
      statusEl.textContent = '关卡加载失败：' + e.message;
      statusEl.classList.add('error');
    });
}

function loadAndStart(raw, displayName){
  var data;
  try{ data = JSON.parse(raw); }
  catch(e){ alert('关卡 JSON 解析失败：' + e.message); return; }

  var level;
  try{ level = normalizeLevel(data); }
  catch(e){ alert('关卡数据格式不正确：' + e.message); return; }

  if(currentGame){ try{ currentGame.stop(); }catch(e){} currentGame = null; }

  // 隐藏通关浮层
  winOverlay.classList.remove('visible');

  // 用全新的 canvas，彻底避免旧事件残留
  var oldCvs = document.getElementById('game');
  var newCvs = document.createElement('canvas');
  newCvs.id = 'game';
  oldCvs.parentNode.replaceChild(newCvs, oldCvs);

  menuEl.classList.add('hidden');
  wrapEl.classList.add('visible');
  exitBtn.classList.add('visible');

  try{
    // 传入一个通关回调
    currentGame = startGameEngine(newCvs, level, function(deaths){
      showWinScreen(deaths);
    });
  }catch(e){
    wrapEl.classList.remove('visible');
    exitBtn.classList.remove('visible');
    menuEl.classList.remove('hidden');
    alert('游戏启动失败：' + e.message);
  }
}

function showWinScreen(deaths){
  winDeathsEl.textContent = deaths;
  winOverlay.classList.add('visible');

  // 判断是否有下一关
  if(currentLevelIndex >= 0 && currentLevelIndex < allLevels.length - 1){
    btnNextLevel.disabled = false;
    btnNextLevel.textContent = '下一关 ▶';
    btnNextLevel.style.opacity = '1';
    btnNextLevel.style.cursor = 'pointer';
  } else {
    btnNextLevel.disabled = true;
    btnNextLevel.textContent = '已是最后一关';
    btnNextLevel.style.opacity = '0.5';
    btnNextLevel.style.cursor = 'default';
  }
}

// 改造 exitLevel 函数，增加 skipConfirm 参数
function exitLevel(skipConfirm){
  // 如果 skipConfirm 为 true，或者已经通关，就不弹窗
  var isWin = winOverlay.classList.contains('visible');
  if(!skipConfirm && !isWin){
    if(!confirm('退出并回到选关界面？')) return;
  }
  
  if(currentGame){ try{ currentGame.stop(); }catch(e){} currentGame = null; }
  
  winOverlay.classList.remove('visible');
  wrapEl.classList.remove('visible');
  exitBtn.classList.remove('visible');
  menuEl.classList.remove('hidden');
  
  var cvs = document.getElementById('game');
  if(cvs){ var ctx = cvs.getContext('2d'); ctx.clearRect(0,0,cvs.width,cvs.height); }
}

exitBtn.addEventListener('click', function(){ exitLevel(false); });
btnBackMenu.addEventListener('click', function(){ exitLevel(true); });

btnNextLevel.addEventListener('click', function(){
  if(currentLevelIndex >= 0 && currentLevelIndex < allLevels.length - 1){
    enterLevel(allLevels[currentLevelIndex + 1], currentLevelIndex + 1);
  }
});

/* ============================================================
   JSON 保存 / 下载
   ============================================================ */
$('btn-save-local').addEventListener('click', function(){
  var txt = pasteBox.value.trim();
  if(!txt){ alert('请先粘贴关卡 JSON 文本'); return; }
  var data;
  try{ data = JSON.parse(txt); }catch(e){ alert('JSON 解析失败：' + e.message); return; }
  try{ normalizeLevel(data); }catch(e){ alert('关卡数据无效：' + e.message); return; }

  var name = nameInput.value.trim() || (data && data.name) || '';
  if(!name){
    name = prompt('给这个关卡起个名字：', '我的关卡');
    if(!name) return;
  }
  addLocalLevel(name, JSON.stringify(data));
  pasteBox.value = '';
  nameInput.value = '';
  refreshLevelList();
});

$('btn-download').addEventListener('click', function(){
  var txt = pasteBox.value.trim();
  if(!txt){ alert('请先粘贴关卡 JSON 文本'); return; }
  var data;
  try{ data = JSON.parse(txt); }catch(e){ alert('JSON 解析失败：' + e.message); return; }
  try{ normalizeLevel(data); }catch(e){ alert('关卡数据无效：' + e.message); return; }

  var name = nameInput.value.trim() || (data && data.name) || 'level';
  var safe = String(name).replace(/[\\/:*?"<>|\s]+/g, '_') + '.json';
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = safe;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){
    URL.revokeObjectURL(a.href);
    document.body.removeChild(a);
  }, 200);
});

$('btn-refresh').addEventListener('click', refreshLevelList);

/* ============================================================
   关卡规范化
   ============================================================ */
function normalizeLevel(d){
  if(!d || typeof d !== 'object') throw new Error('关卡数据格式错误');

  var L = {
    worldW:      Math.max(400, Math.min(20000, d.worldW || 4000)),
    worldH:      Math.max(200, Math.min(3000,  d.worldH || 540)),
    playerMaxHp: Math.max(1,   Math.min(99,    d.playerMaxHp || 3)),
    spawn: {
      x: (d.spawn && typeof d.spawn.x === 'number') ? d.spawn.x : 60,
      y: (d.spawn && typeof d.spawn.y === 'number') ? d.spawn.y : 458
    },
    solids: [], movers: [], spikes: [], adv_spikes: [],
    enemies: [], checkpoints: [], goal: null
  };

  (d.solids || []).forEach(function(s){
    L.solids.push({ x:+s.x||0, y:+s.y||0, w:+s.w||1, h:+s.h||1, hitboxes: s.hitboxes || [] });
  });

  (d.movers || []).forEach(function(m){
    L.movers.push({
      x:+m.x||0, y:+m.y||0, w:+m.w||1, h:+m.h||1,
      ox: (m.ox !== undefined ? +m.ox : (+m.x||0)),
      oy: (m.oy !== undefined ? +m.oy : (+m.y||0)),
      ax:+m.ax||0, ay:+m.ay||0,
      spd: (typeof m.spd === 'number' ? m.spd : 0.02),
      phase: m.phase || 0, dx:0, dy:0,
      path: m.path || [], pathSpeed: m.pathSpeed || 2,
      pathDist: m.pathDist || 0, pathDir: m.pathDir || 1,
      hitboxes: m.hitboxes || []
    });
  });

  (d.spikes || []).forEach(function(s){
    L.spikes.push({ x:+s.x||0, y:+s.y||0, w:+s.w||1, h:+s.h||1 });
  });

  (d.adv_spikes || []).forEach(function(s){
    L.adv_spikes.push({

var keys = {};

on(window, 'mouseup', function(){ mouse.down = false; });

var state = { mode: 'play', deaths: 0, camX: 0, shake: 0, deadTimer: 0, winTimer: 0, t: 0, spawn: { x: SPAWN.x, y: SPAWN.y } };

function updatePath(e){

function addParticles(x, y, n, color, spd, life){

function updateAdvSpikes(){

  state.t++; updateMovers(); updateAdvSpikes();
  if(state.mode === 'play') updatePlayer();
  else if(state.mode === 'dead'){ state.deadTimer--; if(state.deadTimer <= 0) respawn(); }
  else if(state.mode === 'win') {
      state.winTimer++;
      if(!winTriggered) {
          winTriggered = true;
          if(typeof onWinCallback === 'function') onWinCallback(state.deaths);
      }
  }
  updateBullets(); updateEnemies(); updateParticles();
  if(state.mode !== 'win'){
    var targetX = clamp(player.x + player.w/2 - W/2 + player.vx * 6, 0, Math.max(0, WORLD_W - W));
    state.camX += (targetX - state.camX) * 0.12;
  }
  if(state.shake > 0.1) state.shake *= 0.87; else state.shake = 0;
}

var stars = [];
for(var si=0;si<160;si++){ stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.6 + 0.3, d: Math.random()*0.7 + 0.15, a: Math.random()*0.6 + 0.25 }); }

function drawBackground(){
  var g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#07070f'); g.addColorStop(0.55,'#100e1e'); g.addColorStop(1,'#1c1330'); ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  for(var i=0;i<stars.length;i++){ var s = stars[i]; var x = s.x - state.camX * s.d; x = ((x % W) + W) % W; ctx.globalAlpha = s.a; ctx.fillStyle = '#9fb4ff'; ctx.fillRect(x, s.y, s.r, s.r); }
  ctx.globalAlpha = 1; var mx = 780 - state.camX * 0.08; ctx.globalAlpha = 0.55;
  var mg = ctx.createRadialGradient(mx, 110, 10, mx, 110, 90); mg.addColorStop(0, 'rgba(160,180,255,0.45)'); mg.addColorStop(1, 'rgba(160,180,255,0)'); ctx.fillStyle = mg;
  ctx.beginPath(); ctx.arc(mx, 110, 90, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1; ctx.fillStyle = '#20264a'; ctx.beginPath(); ctx.arc(mx, 110, 42, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#2b3260'; ctx.beginPath(); ctx.arc(mx - 14, 100, 8, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(mx + 12, 124, 5, 0, Math.PI*2); ctx.fill();
}
function drawSolids(){
  for(var i=0;i<solids.length;i++){
    var s = solids[i]; if(s._hidden) continue; if(s.x + s.w < state.camX - 120 || s.x > state.camX + W + 120) continue;
    var isMover = movers.indexOf(s) >= 0; ctx.fillStyle = isMover ? '#3b2f5e' : '#242440'; ctx.fillRect(s.x, s.y, s.w, s.h);
    ctx.fillStyle = isMover ? '#8b6ee8' : '#4d4d7d'; ctx.fillRect(s.x, s.y, s.w, 3); ctx.fillStyle = isMover ? '#a78bfa' : '#6a6aa8'; ctx.fillRect(s.x, s.y, s.w, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(s.x, s.y + s.h - 3, s.w, 3);
  }
}
function drawSpikes(){
  for(var i=0;i<spikes.length;i++){
    var s = spikes[i]; if(s.x + s.w < state.camX - 120 || s.x > state.camX + W + 120) continue;
    var n = Math.max(1, Math.round(s.w / 14)); var tw = s.w / n;
    for(var j=0;j<n;j++){
      var x = s.x + j*tw; ctx.beginPath(); ctx.moveTo(x, s.y + s.h); ctx.lineTo(x + tw/2, s.y); ctx.lineTo(x + tw, s.y + s.h); ctx.closePath(); ctx.fillStyle = '#e94560'; ctx.fill();
      ctx.beginPath(); ctx.moveTo(x + tw/2, s.y); ctx.lineTo(x + tw*0.72, s.y + s.h); ctx.lineTo(x + tw/2, s.y + s.h); ctx.closePath(); ctx.fillStyle = 'rgba(255,180,200,0.45)'; ctx.fill();
    }
  }
}
function drawAdvSpikes(layer){
  for(var i=0;i<adv_spikes.length;i++){
    var s = adv_spikes[i];
    if(s.layer !== layer) continue;
    if(s._hidden) continue;
    if(s.x + s.w < state.camX - 120 || s.x > state.camX + W + 120) continue;
    if(!isAdvSpikeVisible(s)) continue;
    var cx = s.x + s.w/2, cy = s.y + s.h/2;
    var rad = Math.max(s.w, s.h) / 2;
    ctx.save();
    ctx.translate(cx, cy);
    if(s.morph === 'pulse'){ var scale = 1 + Math.sin(state.t * 0.1) * 0.2; ctx.scale(scale, scale); }
    else if(s.morph === 'rotate'){ ctx.rotate(state.t * 0.05); }
    ctx.fillStyle = '#ff8c00';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    if(s.shape === 'triangle'){
      var n = 4; var tw = s.w / n;
      for(var j=0;j<n;j++){
        var x = -s.w/2 + j*tw;
        ctx.beginPath(); ctx.moveTo(x, s.h/2); ctx.lineTo(x + tw/2, -s.h/2); ctx.lineTo(x + tw, s.h/2); ctx.closePath(); ctx.fill(); ctx.stroke();
      }
    } else if(s.shape === 'square'){
      ctx.fillRect(-s.w/2, -s.h/2, s.w, s.h); ctx.strokeRect(-s.w/2, -s.h/2, s.w, s.h);
    } else if(s.shape === 'circle'){
      ctx.beginPath(); ctx.arc(0, 0, rad, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }
}
function drawCheckpoints(){
  for(var i=0;i<checkpoints.length;i++){
    var c = checkpoints[i]; if(c.x + c.w < state.camX - 120 || c.x > state.camX + W + 120) continue;
    if(c.type === 'trigger'){
      ctx.fillStyle = c.active ? 'rgba(74,222,128,0.2)' : 'rgba(56,189,248,0.2)';
      ctx.fillRect(c.x, c.y, c.w, c.h);
      ctx.fillStyle = c.active ? '#4ade80' : '#38bdf8';
      ctx.fillRect(c.x + c.w/2 - 1, c.y, 2, c.h);
      if(c.active){
        ctx.globalAlpha = 0.25 + Math.sin(state.t*0.1)*0.12;
        ctx.fillStyle = '#4ade80';
        ctx.beginPath(); ctx.arc(c.x + c.w/2, c.y + c.h/2, 20, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
      }
    } else {
      ctx.fillStyle = c.active ? '#9aa4c0' : '#4a4a68'; ctx.fillRect(c.x + c.w/2 - 2, c.y, 4, c.h);
      var wave = Math.sin(state.t * 0.08) * 3; ctx.beginPath(); ctx.moveTo(c.x + c.w/2 + 2, c.y + 4); ctx.lineTo(c.x + c.w/2 + 24, c.y + 12 + wave); ctx.lineTo(c.x + c.w/2 + 2, c.y + 22); ctx.closePath(); ctx.fillStyle = c.active ? '#4ade80' : '#3a3a55'; ctx.fill();
      if(c.active){ ctx.globalAlpha = 0.25 + Math.sin(state.t*0.1)*0.12; ctx.fillStyle = '#4ade80'; ctx.beginPath(); ctx.arc(c.x + c.w/2, c.y + 20, 22, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1; }
    }
  }
}
function drawGoal(){
  var g = goal; if(g.x + g.w < state.camX - 160 || g.x > state.camX + W + 160) return;
  var pulse = Math.sin(state.t * 0.09) * 0.5 + 0.5; var rg = ctx.createRadialGradient(g.x + g.w/2, g.y + g.h/2, 4, g.x + g.w/2, g.y + g.h/2, 70);
  rg.addColorStop(0, 'rgba(253,224,71,' + (0.35 + pulse*0.25) + ')'); rg.addColorStop(1, 'rgba(253,224,71,0)'); ctx.fillStyle = rg; ctx.fillRect(g.x - 60, g.y - 60, g.w + 120, g.h + 120);
  ctx.fillStyle = '#fde047'; ctx.fillRect(g.x, g.y, g.w, g.h); ctx.fillStyle = '#0b0b18'; ctx.fillRect(g.x + 5, g.y + 5, g.w - 10, g.h - 5);
  ctx.globalAlpha = 0.5 + pulse * 0.5; ctx.fillStyle = '#fef9c3';
  for(var i=0;i<4;i++) ctx.fillRect(g.x + 9, g.y + 14 + i*16, g.w - 18, 3);
  ctx.globalAlpha = 1;
}
function drawEnemies(){
  for(var i=0;i<enemies.length;i++){
    var e = enemies[i]; if(!e.alive || e._hidden) continue; if(e.x + e.w < state.camX - 120 || e.x > state.camX + W + 120) continue;
    if(e.type === 'walker'){
      ctx.fillStyle = '#f59e0b'; ctx.fillRect(e.x, e.y, e.w, e.h); ctx.fillStyle = '#b45309'; ctx.fillRect(e.x, e.y + e.h - 6, e.w, 6);
      ctx.fillStyle = '#1a0a00'; var ex = e.vx > 0 ? e.x + e.w - 9 : e.x + 3; ctx.fillRect(ex, e.y + 8, 5, 5);
      ctx.fillStyle = '#fff7ed'; ctx.fillRect(e.x + 5, e.y + e.h - 12, 3, 4); ctx.fillRect(e.x + e.w - 9, e.y + e.h - 12, 3, 4);
    } else if(e.type === 'shooter'){
      var cx = e.x + e.w/2, cy = e.y + e.h/2; var rg = ctx.createRadialGradient(cx, cy, 2, cx, cy, 26); rg.addColorStop(0, 'rgba(233,69,96,0.5)'); rg.addColorStop(1, 'rgba(233,69,96,0)');
      ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(cx, cy, 26, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#e94560'; ctx.beginPath(); ctx.arc(cx, cy, e.w/2, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#1a0a12'; ctx.beginPath(); ctx.arc(cx, cy, e.w/4, 0, Math.PI*2); ctx.fill(); var pulse = Math.sin(state.t*0.15)*0.5+0.5; ctx.fillStyle = 'rgba(255,220,120,' + (0.5+pulse*0.5) + ')'; ctx.beginPath(); ctx.arc(cx, cy, 3.5 + pulse*1.5, 0, Math.PI*2); ctx.fill();
    }
  }
}
function drawBullets(){
  for(var i=0;i<bullets.length;i++){ var b = bullets[i]; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx)); ctx.globalAlpha = 0.35; ctx.fillStyle = '#fde047'; ctx.fillRect(-14, -1.5, 14, 3); ctx.globalAlpha = 1; ctx.fillStyle = '#fef08a'; ctx.fillRect(-3, -2.5, 8, 5); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, -1.5, 4, 3); ctx.restore(); }
  for(var i=0;i<enemyBullets.length;i++){ var b = enemyBullets[i]; var rg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 10); rg.addColorStop(0, 'rgba(255,120,160,1)'); rg.addColorStop(1, 'rgba(233,69,96,0)'); ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(b.x, b.y, 10, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#ff6b8a'; ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, 1.8, 0, Math.PI*2); ctx.fill(); }
}
function drawPlayer(){
  var p = player;
  if(state.mode === 'dead'){ var t = 1 - state.deadTimer / 28; ctx.globalAlpha = Math.max(0, 1 - t*1.4); ctx.fillStyle = '#e94560'; ctx.fillRect(p.x - 4*t, p.y - 4*t, p.w + 8*t, p.h + 8*t); ctx.globalAlpha = 1; return; }
  if(state.mode === 'win') ctx.globalAlpha = 0.6 + Math.sin(state.t*0.3)*0.4;
  if(p.invTimer > 0 && Math.floor(state.t/4)%2===0) { ctx.globalAlpha = 0.3; }
  var cx = p.x + p.w/2, cy = p.y + p.h/2; var rg = ctx.createRadialGradient(cx, cy, 2, cx, cy, 24); rg.addColorStop(0, 'rgba(94,234,212,0.28)'); rg.addColorStop(1, 'rgba(94,234,212,0)'); ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(cx, cy, 24, 0, Math.PI*2); ctx.fill();
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(p.aimAngle); ctx.fillStyle = '#94a3b8'; ctx.fillRect(2, -2.5, 14, 5); ctx.fillStyle = '#e2e8f0'; ctx.fillRect(12, -2, 5, 4); ctx.restore();
  ctx.fillStyle = '#5eead4'; ctx.fillRect(p.x, p.y, p.w, p.h); ctx.strokeStyle = '#0d9488'; ctx.lineWidth = 1; ctx.strokeRect(p.x + 0.5, p.y + 0.5, p.w - 1, p.h - 1);
  ctx.fillStyle = '#062a26'; if(p.facing >= 0){ ctx.fillRect(p.x + p.w - 7, p.y + 5, 3, 4); ctx.fillRect(p.x + p.w - 3, p.y + 5, 2, 4); } else { ctx.fillRect(p.x + 2, p.y + 5, 3, 4); ctx.fillRect(p.x + 6, p.y + 5, 2, 4); }
  ctx.fillStyle = '#0d9488'; ctx.fillRect(p.x - 1, p.y + p.h - 6, p.w + 2, 3); ctx.globalAlpha = 1;
}
function drawParticles(){
  for(var i=0;i<particles.length;i++){ var p = particles[i]; var a = clamp(p.life / p.maxLife, 0, 1); ctx.globalAlpha = a; ctx.fillStyle = p.color; var s = p.size * (0.4 + a * 0.6); ctx.fillRect(p.x - s/2, p.y - s/2, s, s); }
  ctx.globalAlpha = 1;
}
function roundRect(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath(); }
function drawHUD(){
  ctx.fillStyle = 'rgba(10,10,20,0.65)'; roundRect(14, 14, 192, 36, 6); ctx.fill(); ctx.strokeStyle = 'rgba(120,150,255,0.3)'; ctx.lineWidth = 1; roundRect(14.5, 14.5, 191, 35, 6); ctx.stroke();
  ctx.fillStyle = '#e94560'; ctx.font = 'bold 16px "Courier New",monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('☠ 死亡', 26, 33); ctx.fillStyle = '#e2e8f0'; ctx.fillText(('00' + state.deaths).slice(-3), 118, 33);
  ctx.fillStyle = '#e94560';
  for(var i=0; i<player.maxHp; i++){
    ctx.beginPath();
    var hx = 155 + i * 12; var hy = 33;
    ctx.arc(hx, hy, 4, 0, Math.PI*2);
    if(i < player.hp){ ctx.fillStyle = '#e94560'; ctx.fill(); }
    else { ctx.strokeStyle = '#e94560'; ctx.lineWidth = 1; ctx.stroke(); }
  }
  ctx.fillStyle = 'rgba(160,180,220,0.55)'; ctx.font = '13px "Courier New",monospace'; ctx.textAlign = 'right'; ctx.fillText('A/D 移动 · SPACE 跳跃(二段) · 鼠标射击 · R 重来', W - 18, 32);
  var prog = clamp(player.x / (goal.x || 1), 0, 1); ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(W/2 - 180, H - 22, 360, 5); ctx.fillStyle = '#5eead4'; ctx.fillRect(W/2 - 180, H - 22, 360 * prog, 5); ctx.fillStyle = '#fde047'; ctx.fillRect(W/2 + 177, H - 26, 6, 13);
  ctx.fillStyle = '#5eead4'; ctx.beginPath(); ctx.arc(W/2 - 180 + 360*prog, H - 19.5, 4, 0, Math.PI*2); ctx.fill();
  var mx = mouse.x, my = mouse.y; ctx.strokeStyle = 'rgba(253,224,71,0.85)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(mx, my, 9, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(mx - 15, my); ctx.lineTo(mx - 5, my); ctx.moveTo(mx + 5, my); ctx.lineTo(mx + 15, my); ctx.moveTo(mx, my - 15); ctx.lineTo(mx, my - 5); ctx.moveTo(mx, my + 5); ctx.lineTo(mx, my + 15); ctx.stroke();
}

function render(){
  ctx.clearRect(0,0,W,H); drawBackground(); var sx = state.shake > 0.2 ? rnd(-state.shake, state.shake) : 0; var sy = state.shake > 0.2 ? rnd(-state.shake, state.shake) : 0;
  ctx.save(); ctx.translate(-Math.round(state.camX) + sx, sy);
  drawSolids(); drawSpikes(); drawCheckpoints(); drawGoal();
  drawAdvSpikes('bottom');
  drawEnemies(); drawBullets(); drawPlayer(); drawAdvSpikes('top'); drawParticles();
  ctx.restore();
  drawHUD();
  
  if(state.mode === 'dead'){ 
    var a = (state.deadTimer / 28) * 0.35; 
    ctx.fillStyle = 'rgba(233,69,96,' + a + ')'; 
    ctx.fillRect(0,0,W,H); 
  }
}

var lastTime = performance.now(); var accumulator = 0; var STEP = 1000 / 60;
function loop(now){
  if(!running) return;
  rafId = requestAnimationFrame(loop);
  var delta = now - lastTime; lastTime = now; if(delta > 100) delta = 100; accumulator += delta; var guard = 0;
  while(accumulator >= STEP && guard < 5){ update(); accumulator -= STEP; guard++; }
  if(guard >= 5) accumulator = 0; render();
}

state.camX = 0;
rafId = requestAnimationFrame(loop);

return {
  stop: function(){
    running = false;
    if(rafId) cancelAnimationFrame(rafId);
    rafId = null;
    for(var i = 0; i < listeners.length; i++){
      var l = listeners[i];
      try{ l.target.removeEventListener(l.event, l.fn, l.opts); }catch(e){}
    }
    listeners = [];
  }
};

} /* end startGameEngine */

/* ============================================================
   初始化
   ============================================================ */
(function init(){
  refreshLevelList();

  var levelUrl = null;
  try{ levelUrl = new URLSearchParams(location.search).get('level'); }catch(e){}

  if(levelUrl){
    statusEl.textContent = '正在从 URL 加载关卡...';
    fetch(levelUrl)
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function(txt){
        var nm = levelUrl.split('/').pop().replace(/\.json$/i, '');
        // 传入 -1 代表没有上下文（直接打开的单个关卡），无法下一关
        currentLevelIndex = -1; 
        loadAndStart(txt, nm);
      })
      .catch(function(e){
        statusEl.textContent = '自动加载失败：' + e.message;
        statusEl.classList.add('error');
      });
    return;
  }
})();

})();
</script>
