<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Wanna Shoot · 游玩版</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;width:100%;background:#05050c;color:#c8d0e8;
    font-family:'Courier New',Consolas,monospace;font-size:13px;overflow:hidden;}

  /* ===== 加载界面 ===== */
  #loader{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,#151530,#05050c 70%);
    z-index:100;padding:20px;overflow-y:auto;
  }
  #loader.hidden{display:none;}
  .load-card{
    background:#12121e;border:1px solid #26263f;border-radius:12px;
    max-width:540px;width:100%;padding:26px;
    box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 0 1px rgba(120,150,255,.08) inset;
  }
  .load-card h1{
    color:#5eead4;font-size:20px;text-align:center;margin-bottom:4px;
    text-shadow:0 0 16px rgba(94,234,212,.45);
  }
  .load-card .sub{color:#6a7290;font-size:11px;text-align:center;margin-bottom:22px;line-height:1.6;}

  .sec{margin-bottom:16px;}
  .sec-title{color:#6a7290;font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:7px;}

  #drop{
    border:2px dashed #2f2f4d;border-radius:8px;padding:22px 16px;text-align:center;
    cursor:pointer;transition:.15s;background:#0c0c16;
  }
  #drop:hover,#drop.drag{border-color:#5eead4;background:#0d1f1d;box-shadow:0 0 20px rgba(94,234,212,.1);}
  #drop .ico{font-size:26px;margin-bottom:6px;}
  #drop .t1{color:#c8d0e8;font-size:12px;margin-bottom:3px;}
  #drop .t2{color:#6a7290;font-size:10px;}

  textarea{
    width:100%;background:#0c0c16;border:1px solid #26263f;color:#c8d0e8;
    padding:8px 10px;border-radius:6px;font-family:inherit;font-size:11px;
    resize:vertical;min-height:70px;outline:none;line-height:1.5;
  }
  textarea:focus{border-color:#3d3d66;background:#0f0f1e;}

  .btn{
    background:#16302e;color:#7dfbe1;border:1px solid #2a5f57;
    padding:8px 14px;border-radius:6px;cursor:pointer;font-family:inherit;
    font-size:12px;transition:.13s;width:100%;letter-spacing:.5px;
  }
  .btn:hover{background:#175c53;border-color:#2a9b88;color:#a7fff0;}
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:.4;cursor:default;transform:none;}

  #err{color:#e94560;font-size:11px;margin-top:8px;text-align:center;min-height:14px;line-height:1.4;}
  .footer{color:#3a3f58;font-size:10px;text-align:center;margin-top:18px;line-height:1.6;}

  /* ===== 游戏 ===== */
  #wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(100vw,177.78vh);aspect-ratio:960/540;
    box-shadow:0 0 80px rgba(90,130,255,.25),0 0 0 1px rgba(120,150,255,.15);
    border-radius:8px;overflow:hidden;display:none;}
  #wrap.visible{display:block;}
  canvas{display:block;width:100%;height:100%;cursor:crosshair;}

  #exit-btn{
    position:fixed;top:10px;right:12px;z-index:60;
    background:rgba(20,20,40,.85);color:#c8d0e8;border:1px solid #26263f;
    padding:6px 12px;border-radius:6px;cursor:pointer;font-family:inherit;
    font-size:11px;transition:.13s;display:none;backdrop-filter:blur(4px);
  }
  #exit-btn.visible{display:block;}
  #exit-btn:hover{background:#252540;color:#fff;border-color:#3d3d66;}
</style>
</head>
<body>

<div id="loader">
  <div class="load-card">
    <h1>🎮 I WANNA SHOOT</h1>
    <div class="sub">加载关卡数据开始游玩<br>由朋友从编辑器导出后分享给你</div>

    <div class="sec">
      <div class="sec-title">方式一 · 上传 JSON 文件</div>
      <div id="drop">
        <div class="ico">📂</div>
        <div class="t1">点击选择文件 或 拖拽到此处</div>
        <div class="t2">支持 .json 关卡文件</div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-title">方式二 · 粘贴 JSON 数据</div>
      <textarea id="paste-box" placeholder="在此粘贴关卡 JSON 数据..."></textarea>
      <button class="btn" id="btn-load-paste" style="margin-top:8px;">▶ 加载并开始</button>
    </div>

    <div id="err"></div>
    <div class="footer">关卡 JSON 可从编辑器的「保存 JSON」按钮导出</div>
  </div>
</div>

<div id="wrap"><canvas id="game"></canvas></div>
<button id="exit-btn">✕ 退出关卡</button>

<script>
(function(){
"use strict";

/* ==========================================================
   加载流程：
   1) 文件上传 / 拖拽 / 粘贴
   2) URL 参数 ?level=<url>   （同源 JSON 文件，适合 GitHub Pages）
   3) URL hash #<base64>      （整份关卡数据内嵌，方便分享）
   ========================================================== */

var $ = function(id){ return document.getElementById(id); };
var loaderEl = $('loader');
var wrapEl   = $('wrap');
var exitBtn  = $('exit-btn');
var errEl    = $('err');
var pasteBox = $('paste-box');
var dropEl   = $('drop');

/* ---------- 关卡规范化（兼容编辑器导出的各种字段） ---------- */
function normalizeLevel(d){
  if(!d || typeof d !== 'object') throw new Error('关卡数据格式错误');

  var L = {
    worldW:      Math.max(400, Math.min(20000, d.worldW || 4000)),
    worldH:      Math.max(200, Math.min(3000,  d.worldH || 540)),
    playerMaxHp: Math.max(1,   Math.min(99,    d.playerMaxHp || 3)),
    spawn: {
      x: (d.spawn && typeof d.spawn.x === 'number') ? d.spawn.x : 60,
      y: (d.spawn && typeof d.spawn.y === 'number') ? d.spawn.y : 458
    },
    solids: [], movers: [], spikes: [], adv_spikes: [],
    enemies: [], checkpoints: [], goal: null
  };

  (d.solids || []).forEach(function(s){
    L.solids.push({ x:+s.x||0, y:+s.y||0, w:+s.w||1, h:+s.h||1, hitboxes: s.hitboxes || [] });
  });

  (d.movers || []).forEach(function(m){
    L.movers.push({
      x:+m.x||0, y:+m.y||0, w:+m.w||1, h:+m.h||1,
      ox: (m.ox !== undefined ? +m.ox : (+m.x||0)),
      oy: (m.oy !== undefined ? +m.oy : (+m.y||0)),
      ax:+m.ax||0, ay:+m.ay||0,
      spd: (typeof m.spd === 'number' ? m.spd : 0.02),
      phase: m.phase || 0, dx:0, dy:0,
      path: m.path || [], pathSpeed: m.pathSpeed || 2,
      pathDist: m.pathDist || 0, pathDir: m.pathDir || 1,
      hitboxes: m.hitboxes || []
    });
  });

  (d.spikes || []).forEach(function(s){
    L.spikes.push({ x:+s.x||0, y:+s.y||0, w:+s.w||1, h:+s.h||1 });
  });

  (d.adv_spikes || []).forEach(function(s){
    L.adv_spikes.push({
      x:+s.x||0, y:+s.y||0, w:+s.w||1, h:+s.h||1,
      damage: s.damage || 1,
      shape: s.shape || 'triangle',
      visibility: s.visibility || 'always',
      morph: s.morph || 'none',
      layer: s.layer || 'top',
      hitboxes: s.hitboxes || [],
      phase: s.phase || 0,
      ox: (s.ox !== undefined ? +s.ox : (+s.x||0)),
      oy: (s.oy !== undefined ? +s.oy : (+s.y||0)),
      path: s.path || [], pathSpeed: s.pathSpeed || 2,
      pathDist: s.pathDist || 0, pathDir: s.pathDir || 1
    });
  });

  (d.enemies || []).forEach(function(e){
    var type = e.type || 'walker';
    var base = {
      type: type,
      x:+e.x||0, y:+e.y||0, w:+e.w||1, h:+e.h||1,
      alive: true,
      path: e.path || [], pathSpeed: e.pathSpeed || 2,
      pathDist: e.pathDist || 0, pathDir: e.pathDir || 1,
      hitboxes: e.hitboxes || []
    };
    if(type === 'walker'){
      base.minX = (e.minX !== undefined ? +e.minX : (+e.x||0) - 100);
      base.maxX = (e.maxX !== undefined ? +e.maxX : (+e.x||0) + (+e.w||20) + 100);
      base.vx   = (typeof e.vx === 'number' ? e.vx : 1.5);
    } else if(type === 'shooter'){
      base.baseY = (e.baseY !== undefined ? +e.baseY : (+e.y||0));
      base.phase = e.phase || 0;
      base.cd    = e.cd || 90;
    }
    L.enemies.push(base);
  });

  (d.checkpoints || []).forEach(function(c){
    L.checkpoints.push({
      type: c.type || 'checkpoint',
      x:+c.x||0, y:+c.y||0, w:+c.w||1, h:+c.h||1,
      spawnX: (c.spawnX !== undefined ? +c.spawnX : Math.round((+c.x||0) + (+c.w||20)/2 - 7)),
      spawnY: (c.spawnY !== undefined ? +c.spawnY : Math.round((+c.y||0) + (+c.h||40) - 22)),
      active: false
    });
  });

  if(d.goal && (d.goal.w || d.goal.h)){
    L.goal = { x:+d.goal.x||0, y:+d.goal.y||0, w:+d.goal.w||34, h:+d.goal.h||80 };
  } else {
    L.goal = { x: L.worldW - 120, y: 400, w: 34, h: 80 };
  }

  return L;
}

/* ---------- 错误提示 ---------- */
function showError(msg){ errEl.textContent = msg || ''; }

/* ---------- 加载入口 ---------- */
function loadAndStart(raw){
  var txt = (typeof raw === 'string') ? raw.replace(/^\uFEFF/, '').trim() : raw;
  var data;
  try{
    data = (typeof txt === 'string') ? JSON.parse(txt) : txt;
  }catch(e){
    showError('JSON 解析失败：' + e.message);
    return;
  }
  var level;
  try{
    level = normalizeLevel(data);
  }catch(e){
    showError(e.message);
    return;
  }

  loaderEl.classList.add('hidden');
  wrapEl.classList.add('visible');
  exitBtn.classList.add('visible');

  try{
    startGame(level);
  }catch(e){
    // 如果游戏崩溃，回退到加载界面
    loaderEl.classList.remove('hidden');
    wrapEl.classList.remove('visible');
    exitBtn.classList.remove('visible');
    showError('游戏启动失败：' + e.message);
  }
}

/* ---------- 文件读取 ---------- */
function readFile(f){
  if(!f) return;
  var reader = new FileReader();
  reader.onload = function(){ loadAndStart(reader.result); };
  reader.onerror = function(){ showError('文件读取失败'); };
  reader.readAsText(f);
}

/* ---------- 拖拽 / 点击上传 ---------- */
dropEl.addEventListener('click', function(){
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.addEventListener('change', function(){
    if(inp.files && inp.files[0]) readFile(inp.files[0]);
  });
  inp.click();
});

['dragenter','dragover'].forEach(function(ev){
  dropEl.addEventListener(ev, function(e){
    e.preventDefault(); e.stopPropagation();
    dropEl.classList.add('drag');
  });
});
['dragleave','drop'].forEach(function(ev){
  dropEl.addEventListener(ev, function(e){
    e.preventDefault(); e.stopPropagation();
    dropEl.classList.remove('drag');
  });
});
dropEl.addEventListener('drop', function(e){
  if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]){
    readFile(e.dataTransfer.files[0]);
  }
});

/* ---------- 粘贴加载 ---------- */
$('btn-load-paste').addEventListener('click', function(){
  var txt = pasteBox.value.trim();
  if(!txt){ showError('请先粘贴关卡 JSON 数据'); return; }
  loadAndStart(txt);
});

/* ---------- 退出 ---------- */
exitBtn.addEventListener('click', function(){
  if(!confirm('确定退出并重新选择关卡吗？')) return;
  if(location.search || location.hash){
    location.href = location.pathname;   // 去掉参数重新加载
  } else {
    location.reload();
  }
});

/* ---------- 从 URL 自动加载 ---------- */
window.addEventListener('DOMContentLoaded', function(){
  // 优先级：?level=url > #base64
  var levelUrl = null;
  try{
    levelUrl = new URLSearchParams(location.search).get('level');
  }catch(e){}

  if(levelUrl){
    fetch(levelUrl)
      .then(function(r){
        if(!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function(txt){ loadAndStart(txt); })
      .catch(function(err){ showError('关卡文件加载失败：' + err.message); });
    return;
  }

  var hash = location.hash.slice(1);
  if(hash){
    try{
      var b64 = decodeURIComponent(hash);
      var decoded = atob(b64);
      var json = decodeURIComponent(escape(decoded));   // UTF-8 还原
      loadAndStart(json);
    }catch(e){
      showError('分享链接解析失败');
    }
  }
});

/* ==========================================================
   游戏引擎（与编辑器内模板保持一致）
   ========================================================== */
function startGame(L){

var cvs = document.getElementById('game');
var ctx = cvs.getContext('2d');
var W = 960, H = 540;
cvs.width = W; cvs.height = H;
ctx.imageSmoothingEnabled = false;

var clamp = function(v,a,b){ return v<a?a:v>b?b:v; };
var rnd = function(a,b){ return a + Math.random()*(b-a); };
var rectHit = function(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; };

var WORLD_W = L.worldW;
var WORLD_H = L.worldH;
var MAX_HP  = L.playerMaxHp;
var SPAWN   = L.spawn;
var staticSolids = L.solids;
var movers       = L.movers;
var spikes       = L.spikes;
var adv_spikes   = L.adv_spikes;
var enemies      = L.enemies;
var checkpoints  = L.checkpoints;
var goal         = L.goal;

var solids = staticSolids.concat(movers);

var audioCtx = null;
function initAudio(){
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
}
function beep(freq, dur, type, vol){
  if(!audioCtx) return;
  try{
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(vol || 0.02, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}

var keys = {};
var mouse = { x: W*0.8, y: H/2, down: false };

window.addEventListener('keydown', function(e){
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code) >= 0) e.preventDefault();
  if(!keys[e.code]){
    if(e.code==='Space' || e.code==='KeyW' || e.code==='ArrowUp') player.jumpBuffer = 8;
    if(e.code === 'KeyR' && state.mode === 'play') killPlayer();
  }
  keys[e.code] = true;
  initAudio();
});
window.addEventListener('keyup', function(e){ keys[e.code] = false; });
window.addEventListener('blur', function(){ for(var k in keys) keys[k] = false; mouse.down = false; });

cvs.addEventListener('mousemove', function(e){
  var r = cvs.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top)  * (H / r.height);
});
cvs.addEventListener('mousedown', function(e){ mouse.down = true; initAudio(); e.preventDefault(); });
window.addEventListener('mouseup', function(){ mouse.down = false; });
cvs.addEventListener('contextmenu', function(e){ e.preventDefault(); });

var state = { mode: 'play', deaths: 0, camX: 0, shake: 0, deadTimer: 0, winTimer: 0, t: 0, spawn: { x: SPAWN.x, y: SPAWN.y } };
var player = { x: SPAWN.x, y: SPAWN.y, w: 14, h: 22, vx: 0, vy: 0, onGround: false, ground: null, jumpsLeft: 1, coyote: 0, jumpBuffer: 0, facing: 1, shootCd: 0, aimAngle: 0, maxHp: MAX_HP, hp: MAX_HP, invTimer: 0, slowTimer: 0, fastTimer: 0, bounceCd: 0 };
var bullets = [], enemyBullets = [], particles = [];

function updatePath(e){
  if(!e.path || e.path.length < 2) return;
  var totalLen = 0, lens = [];
  for(var i=0; i<e.path.length-1; i++){
    var dx = e.path[i+1].x - e.path[i].x;
    var dy = e.path[i+1].y - e.path[i].y;
    var l = Math.hypot(dx, dy);
    lens.push(l); totalLen += l;
  }
  if(totalLen === 0) return;
  if(e.pathDist === undefined) e.pathDist = 0;
  if(e.pathDir === undefined) e.pathDir = 1;
  e.pathDist += (e.pathSpeed || 2) * e.pathDir;
  if(e.pathDist > totalLen){ e.pathDist = totalLen; e.pathDir = -1; }
  if(e.pathDist < 0){ e.pathDist = 0; e.pathDir = 1; }
  var d = e.pathDist;
  for(var i=0; i<lens.length; i++){
    if(d <= lens[i] || i === lens.length - 1){
      var t = d / lens[i]; if(t > 1) t = 1;
      e.x = e.path[i].x + (e.path[i+1].x - e.path[i].x) * t;
      e.y = e.path[i].y + (e.path[i+1].y - e.path[i].y) * t;
      break;
    }
    d -= lens[i];
  }
}

function addParticles(x, y, n, color, spd, life){
  life = life || 30;
  for(var i=0;i<n;i++){
    var a = Math.random()*Math.PI*2;
    var s = rnd(spd*0.3, spd);
    particles.push({ x: x, y: y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 1, life: rnd(life*0.5, life), maxLife: life, color: color, size: rnd(1.5, 3.5) });
  }
}
function updateParticles(){
  for(var i=particles.length-1;i>=0;i--){
    var p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.vx *= 0.97; p.life--;
    if(p.life <= 0) particles.splice(i,1);
  }
}
function moveEntity(e, list){
  e.x += e.vx;
  for(var i=0;i<list.length;i++){
    var s = list[i];
    if(s._hidden) continue;
    if(rectHit(e, s)){
      if(e.vx > 0) e.x = s.x - e.w; else if(e.vx < 0) e.x = s.x + s.w;
      e.vx = 0;
    }
  }
  e.y += e.vy; e.onGround = false; e.ground = null;
  for(var j=0;j<list.length;j++){
    var t = list[j];
    if(t._hidden) continue;
    if(rectHit(e, t)){
      if(e.vy >= 0){ e.y = t.y - e.h; e.vy = 0; e.onGround = true; e.ground = t; }
      else { e.y = t.y + t.h; e.vy = 0; }
    }
  }
}
function updateMovers(){
  for(var i=0;i<movers.length;i++){
    var m = movers[i];
    var px = m.x, py = m.y;
    if(m.path && m.path.length >= 2){
      updatePath(m);
    } else {
      m.phase += m.spd;
      m.x = m.ox + Math.sin(m.phase) * m.ax;
      m.y = m.oy + Math.sin(m.phase) * m.ay;
    }
    m.dx = m.x - px; m.dy = m.y - py;
    if(player.onGround && player.ground === m && state.mode === 'play'){ player.x += m.dx; player.y += m.dy; }
  }
}
function updatePlayer(){
  var p = player;
  if(p.slowTimer > 0) p.slowTimer--;
  if(p.fastTimer > 0) p.fastTimer--;
  if(p.bounceCd > 0) p.bounceCd--;

  var spdMod = 1;
  if(p.slowTimer > 0) spdMod = 0.5;
  else if(p.fastTimer > 0) spdMod = 1.8;

  var ax = 0;
  if(keys['ArrowLeft'] || keys['KeyA']) ax--;
  if(keys['ArrowRight']|| keys['KeyD']) ax++;
  if(ax !== 0){ p.vx += ax * 1.25 * spdMod; p.facing = ax; }
  else { p.vx *= 0.78; if(Math.abs(p.vx) < 0.15) p.vx = 0; }
  p.vx = clamp(p.vx, -4.6 * spdMod, 4.6 * spdMod);
  p.vy += 0.62;
  if(p.vy > 15) p.vy = 15;
  moveEntity(p, solids);
  if(p.onGround){ p.jumpsLeft = 1; p.coyote = 8; } else if(p.coyote > 0) p.coyote--;
  if(p.jumpBuffer > 0) p.jumpBuffer--;
  if(p.jumpBuffer > 0){
    if(p.onGround || p.coyote > 0){
      p.vy = -11.6; p.jumpsLeft = 1; p.coyote = 0; p.onGround = false; p.jumpBuffer = 0;
      addParticles(p.x + p.w/2, p.y + p.h, 6, '#5eead4', 2.5, 18); beep(430, 0.07, 'square', 0.018);
    } else if(p.jumpsLeft > 0){
      p.vy = -10.2; p.jumpsLeft = 0; p.jumpBuffer = 0;
      addParticles(p.x + p.w/2, p.y + p.h, 12, '#a78bfa', 4, 22); beep(680, 0.08, 'square', 0.018);
    }
  }
  if(p.invTimer > 0) p.invTimer--;

  var wmx = mouse.x + state.camX;
  p.aimAngle = Math.atan2(mouse.y - (p.y + p.h/2), wmx - (p.x + p.w/2));
  if(p.shootCd > 0) p.shootCd--;
  if((mouse.down || keys['KeyJ']) && p.shootCd <= 0){ shoot(); p.shootCd = 9; }

  checkHitboxTriggers();
  checkHazards();
}
function shoot(){
  var p = player, a = p.aimAngle;
  var cx = p.x + p.w/2 + Math.cos(a)*14;
  var cy = p.y + p.h/2 + Math.sin(a)*14;
  bullets.push({ x: cx, y: cy, vx: Math.cos(a)*14, vy: Math.sin(a)*14, life: 80 });

  var cx = p.x + p.w/2, cy = p.y + p.h/2; var rg = ctx.createRadialGradient(cx, cy, 2, cx, cy, 24); rg.addColorStop(0, 'rgba(94,234,212,0.28)'); rg.addColorStop(1, 'rgba(94,234,212,0)'); ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(cx, cy, 24, 0, Math.PI*2); ctx.fill();
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(p.aimAngle); ctx.fillStyle = '#94a3b8'; ctx.fillRect(2, -2.5, 14, 5); ctx.fillStyle = '#e2e8f0'; ctx.fillRect(12, -2, 5, 4); ctx.restore();
  ctx.fillStyle = '#5eead4'; ctx.fillRect(p.x, p.y, p.w, p.h); ctx.strokeStyle = '#0d9488'; ctx.lineWidth = 1; ctx.strokeRect(p.x + 0.5, p.y + 0.5, p.w - 1, p.h - 1);
  ctx.fillStyle = '#062a26'; if(p.facing >= 0){ ctx.fillRect(p.x + p.w - 7, p.y + 5, 3, 4); ctx.fillRect(p.x + p.w - 3, p.y + 5, 2, 4); } else { ctx.fillRect(p.x + 2, p.y + 5, 3, 4); ctx.fillRect(p.x + 6, p.y + 5, 2, 4); }
  ctx.fillStyle = '#0d9488'; ctx.fillRect(p.x - 1, p.y + p.h - 6, p.w + 2, 3); ctx.globalAlpha = 1;
}
function drawParticles(){
  for(var i=0;i<particles.length;i++){ var p = particles[i]; var a = clamp(p.life / p.maxLife, 0, 1); ctx.globalAlpha = a; ctx.fillStyle = p.color; var s = p.size * (0.4 + a * 0.6); ctx.fillRect(p.x - s/2, p.y - s/2, s, s); }
  ctx.globalAlpha = 1;
}
function roundRect(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath(); }
function drawHUD(){
  ctx.fillStyle = 'rgba(10,10,20,0.65)'; roundRect(14, 14, 192, 36, 6); ctx.fill(); ctx.strokeStyle = 'rgba(120,150,255,0.3)'; ctx.lineWidth = 1; roundRect(14.5, 14.5, 191, 35, 6); ctx.stroke();
  ctx.fillStyle = '#e94560'; ctx.font = 'bold 16px "Courier New",monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('☠ 死亡', 26, 33); ctx.fillStyle = '#e2e8f0'; ctx.fillText(('00' + state.deaths).slice(-3), 118, 33);

  ctx.fillStyle = '#e94560';
  for(var i=0; i<player.maxHp; i++){
    ctx.beginPath();
    var hx = 155 + i * 12;
    var hy = 33;
    ctx.arc(hx, hy, 4, 0, Math.PI*2);
    if(i < player.hp){ ctx.fillStyle = '#e94560'; ctx.fill(); }
    else { ctx.strokeStyle = '#e94560'; ctx.lineWidth = 1; ctx.stroke(); }
  }

  ctx.fillStyle = 'rgba(160,180,220,0.55)'; ctx.font = '13px "Courier New",monospace'; ctx.textAlign = 'right'; ctx.fillText('A/D 移动 · SPACE 跳跃(二段) · 鼠标射击 · R 重来', W - 18, 32);
  var prog = clamp(player.x / (goal.x || 1), 0, 1); ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(W/2 - 180, H - 22, 360, 5); ctx.fillStyle = '#5eead4'; ctx.fillRect(W/2 - 180, H - 22, 360 * prog, 5); ctx.fillStyle = '#fde047'; ctx.fillRect(W/2 + 177, H - 26, 6, 13);
  ctx.fillStyle = '#5eead4'; ctx.beginPath(); ctx.arc(W/2 - 180 + 360*prog, H - 19.5, 4, 0, Math.PI*2); ctx.fill();
  var mx = mouse.x, my = mouse.y; ctx.strokeStyle = 'rgba(253,224,71,0.85)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(mx, my, 9, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(mx - 15, my); ctx.lineTo(mx - 5, my); ctx.moveTo(mx + 5, my); ctx.lineTo(mx + 15, my); ctx.moveTo(mx, my - 15); ctx.lineTo(mx, my - 5); ctx.moveTo(mx, my + 5); ctx.lineTo(mx, my + 15); ctx.stroke();
}
function drawOverlay(){
  if(state.mode === 'dead'){ var a = (state.deadTimer / 28) * 0.35; ctx.fillStyle = 'rgba(233,69,96,' + a + ')'; ctx.fillRect(0,0,W,H); }
  if(state.mode === 'win'){
    var al = clamp(state.winTimer / 40, 0, 1); ctx.fillStyle = 'rgba(5,5,15,' + (0.72 * al) + ')'; ctx.fillRect(0,0,W,H); ctx.globalAlpha = al; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var bounce = Math.sin(state.t * 0.08) * 6; ctx.font = 'bold 64px "Courier New",monospace'; ctx.fillStyle = '#fde047'; ctx.shadowColor = '#fde047'; ctx.shadowBlur = 30; ctx.fillText('YOU WIN!', W/2, H/2 - 60 + bounce);
    ctx.shadowBlur = 0; ctx.font = 'bold 22px "Courier New",monospace'; ctx.fillStyle = '#e2e8f0'; ctx.fillText('死亡次数: ' + state.deaths, W/2, H/2 + 20);
    ctx.font = '16px "Courier New",monospace'; ctx.fillStyle = 'rgba(180,200,240,0.75)'; ctx.fillText('点击「退出关卡」换一关', W/2, H/2 + 62); ctx.globalAlpha = 1;
  }
}
function render(){
  ctx.clearRect(0,0,W,H); drawBackground(); var sx = state.shake > 0.2 ? rnd(-state.shake, state.shake) : 0; var sy = state.shake > 0.2 ? rnd(-state.shake, state.shake) : 0;
  ctx.save(); ctx.translate(-Math.round(state.camX) + sx, sy);
  drawSolids(); drawSpikes(); drawCheckpoints(); drawGoal();
  drawAdvSpikes('bottom');
  drawEnemies(); drawBullets(); drawPlayer(); drawAdvSpikes('top'); drawParticles();
  ctx.restore();
  drawHUD(); drawOverlay();
}

var lastTime = performance.now(); var accumulator = 0; var STEP = 1000 / 60;
function loop(now){
  requestAnimationFrame(loop); var delta = now - lastTime; lastTime = now; if(delta > 100) delta = 100; accumulator += delta; var guard = 0;
  while(accumulator >= STEP && guard < 5){ update(); accumulator -= STEP; guard++; }
  if(guard >= 5) accumulator = 0; render();
}

state.camX = 0; requestAnimationFrame(loop);

} // end startGame

})();
</script>
